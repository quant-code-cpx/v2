name: ${COMPOSE_PROJECT_NAME:-quant-v2}

# Shared topology. Always combine this file with compose.dev.yaml or compose.prod.yaml.
x-stock-connect-data-sync-environment: &stock-connect-data-sync-environment
  DATA_SYNC_STOCK_CONNECT_ENABLED: ${DATA_SYNC_STOCK_CONNECT_ENABLED:-false}
  DATA_SYNC_STOCK_CONNECT_LICENSE_SCOPE: ${DATA_SYNC_STOCK_CONNECT_LICENSE_SCOPE:-}
  DATA_SYNC_HKEX_SFTP_HOST: ${DATA_SYNC_HKEX_SFTP_HOST:-sftp.data.hkex.com.hk}
  DATA_SYNC_HKEX_SFTP_PORT: ${DATA_SYNC_HKEX_SFTP_PORT:-22}
  DATA_SYNC_HKEX_SFTP_USERNAME: ${DATA_SYNC_HKEX_SFTP_USERNAME:-}
  DATA_SYNC_HKEX_SFTP_PRIVATE_KEY_PATH: /run/quant-v2/stock-connect-config/hkex-sftp-private-key
  DATA_SYNC_HKEX_SFTP_PRIVATE_KEY_PASSPHRASE: ${DATA_SYNC_HKEX_SFTP_PRIVATE_KEY_PASSPHRASE:-}
  DATA_SYNC_HKEX_SFTP_KNOWN_HOSTS_PATH: /run/quant-v2/stock-connect-config/known_hosts
  DATA_SYNC_HKEX_SH_DAILY_PATH_TEMPLATE: ${DATA_SYNC_HKEX_SH_DAILY_PATH_TEMPLATE:-}
  DATA_SYNC_HKEX_SZ_DAILY_PATH_TEMPLATE: ${DATA_SYNC_HKEX_SZ_DAILY_PATH_TEMPLATE:-}
  DATA_SYNC_HKEX_SECURITIES_MASTER_PATH_TEMPLATE: ${DATA_SYNC_HKEX_SECURITIES_MASTER_PATH_TEMPLATE:-}
  DATA_SYNC_HKEX_SECURITIES_MASTER_PROFILE_MANIFEST_PATH: /run/quant-v2/stock-connect-config/hkex-securities-master-fixed-length-profile.json
  DATA_SYNC_HKEX_SECURITIES_MASTER_PROFILE_MANIFEST_SHA256: ${DATA_SYNC_HKEX_SECURITIES_MASTER_PROFILE_MANIFEST_SHA256:-}
  DATA_SYNC_HKEX_CALENDAR_URL_TEMPLATE: ${DATA_SYNC_HKEX_CALENDAR_URL_TEMPLATE:-}
  DATA_SYNC_HKEX_CALENDAR_MANIFEST_PATH: /run/quant-v2/stock-connect-config/hkex-calendar-manifest.json
  DATA_SYNC_HKEX_SFTP_DELIVERY_MANIFEST_PATH: /run/quant-v2/stock-connect-config/hkex-sftp-delivery-manifest.json
  DATA_SYNC_STOCK_CONNECT_STATUS_MANIFEST_PATH: /run/quant-v2/stock-connect-config/stock-connect-status-manifest.json
  DATA_SYNC_STOCK_CONNECT_STATUS_REQUIRED_FROM: ${DATA_SYNC_STOCK_CONNECT_STATUS_REQUIRED_FROM:-}
  DATA_SYNC_STOCK_CONNECT_STATUS_DELIVERY_ROOT: /var/lib/quant-v2/stock-connect-status
  DATA_SYNC_HKEX_OMDC_STATUS_PATH_TEMPLATE: ${DATA_SYNC_HKEX_OMDC_STATUS_PATH_TEMPLATE:-}
  DATA_SYNC_SSE_MDGW_STATUS_PATH_TEMPLATE: ${DATA_SYNC_SSE_MDGW_STATUS_PATH_TEMPLATE:-}
  DATA_SYNC_SZSE_STEP_STATUS_PATH_TEMPLATE: ${DATA_SYNC_SZSE_STEP_STATUS_PATH_TEMPLATE:-}
  DATA_SYNC_STOCK_CONNECT_REQUEST_TIMEOUT_SECONDS: ${DATA_SYNC_STOCK_CONNECT_REQUEST_TIMEOUT_SECONDS:-30}
  DATA_SYNC_STOCK_CONNECT_PREFLIGHT_TIMEOUT_SECONDS: ${DATA_SYNC_STOCK_CONNECT_PREFLIGHT_TIMEOUT_SECONDS:-300}
  DATA_SYNC_STOCK_CONNECT_MIN_PARTITIONS_PER_MINUTE: ${DATA_SYNC_STOCK_CONNECT_MIN_PARTITIONS_PER_MINUTE:-20}
  DATA_SYNC_STOCK_CONNECT_DELIVERY_EXPIRY_SAFETY_SECONDS: ${DATA_SYNC_STOCK_CONNECT_DELIVERY_EXPIRY_SAFETY_SECONDS:-3600}
  DATA_SYNC_STOCK_CONNECT_MAX_DELIVERY_BYTES: ${DATA_SYNC_STOCK_CONNECT_MAX_DELIVERY_BYTES:-67108864}
  DATA_SYNC_STOCK_CONNECT_MAX_MANIFEST_BYTES: ${DATA_SYNC_STOCK_CONNECT_MAX_MANIFEST_BYTES:-262144}
  DATA_SYNC_STOCK_CONNECT_MAX_ZIP_COMPRESSION_RATIO: ${DATA_SYNC_STOCK_CONNECT_MAX_ZIP_COMPRESSION_RATIO:-100}
  DATA_SYNC_STOCK_CONNECT_RAW_RETENTION_MODE: ${DATA_SYNC_STOCK_CONNECT_RAW_RETENTION_MODE:-MANIFEST_ONLY}
  DATA_SYNC_STOCK_CONNECT_RAW_RETENTION_LICENSE_REFERENCE: ${DATA_SYNC_STOCK_CONNECT_RAW_RETENTION_LICENSE_REFERENCE:-}
  DATA_SYNC_STOCK_CONNECT_RAW_KMS_KEY_ID: ${DATA_SYNC_STOCK_CONNECT_RAW_KMS_KEY_ID:-}
  DATA_SYNC_STOCK_CONNECT_CURSOR_HMAC_SECRET: ${DATA_SYNC_STOCK_CONNECT_CURSOR_HMAC_SECRET:-}

services:
  service-web:
    image: quant-v2/service-web:local
    profiles: ["web"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - public
    restart: unless-stopped

  service-api-postgres:
    image: postgres:17.4-bookworm
    profiles: ["api", "api-infra"]
    environment:
      POSTGRES_DB: ${SERVICE_API_POSTGRES_DATABASE:?set SERVICE_API_POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${SERVICE_API_POSTGRES_PASSWORD:?set SERVICE_API_POSTGRES_PASSWORD}
      POSTGRES_USER: ${SERVICE_API_POSTGRES_USER:?set SERVICE_API_POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - service_api_postgres:/var/lib/postgresql/data
    networks:
      - service-api-internal
    restart: unless-stopped

  service-api-redis:
    image: redis:7.4.2-alpine
    profiles: ["api", "api-infra"]
    command:
      [
        "/bin/sh",
        "-ec",
        'exec redis-server --appendonly yes --requirepass "$$SERVICE_API_REDIS_PASSWORD"',
      ]
    environment:
      SERVICE_API_REDIS_PASSWORD: ${SERVICE_API_REDIS_PASSWORD:?set SERVICE_API_REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a $$SERVICE_API_REDIS_PASSWORD ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - service_api_redis:/data
    networks:
      - service-api-internal
    restart: unless-stopped

  service-api-migrate:
    image: quant-v2/service-api:migrate
    profiles: ["api"]
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      service-api-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${SERVICE_API_POSTGRES_USER}:${SERVICE_API_POSTGRES_PASSWORD}@service-api-postgres:5432/${SERVICE_API_POSTGRES_DATABASE}
      HOME: /tmp
    networks:
      - service-api-internal
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: "no"

  service-api-bootstrap:
    image: quant-v2/service-api:migrate
    profiles: ["api"]
    command: ["node", "dist/scripts/bootstrap-admin.js"]
    depends_on:
      service-api-postgres:
        condition: service_healthy
      service-api-redis:
        condition: service_healthy
      service-api-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: ${SERVICE_API_PREFIX:-api/v1}
      DATABASE_URL: postgresql://${SERVICE_API_POSTGRES_USER}:${SERVICE_API_POSTGRES_PASSWORD}@service-api-postgres:5432/${SERVICE_API_POSTGRES_DATABASE}
      REDIS_URL: redis://:${SERVICE_API_REDIS_PASSWORD}@service-api-redis:6379/0
      REDIS_KEY_PREFIX: ${SERVICE_API_REDIS_KEY_PREFIX:-quant-v2:api}
      JWT_ISSUER: ${SERVICE_API_JWT_ISSUER:-quant-v2}
      JWT_AUDIENCE: ${SERVICE_API_JWT_AUDIENCE:-quant-v2-web}
      JWT_ACCESS_SECRET: ${SERVICE_API_JWT_ACCESS_SECRET:?set SERVICE_API_JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${SERVICE_API_JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${SERVICE_API_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      COOKIE_SAME_SITE: ${SERVICE_API_COOKIE_SAME_SITE:-lax}
      COOKIE_SECURE: "false"
      CORS_ORIGIN: ${SERVICE_API_DEV_CORS_ORIGIN:-http://127.0.0.1:15173}
      TRUST_PROXY: "false"
      LOGIN_FAILURE_WINDOW_SECONDS: ${SERVICE_API_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_LOCK_SECONDS: ${SERVICE_API_LOGIN_LOCK_SECONDS:-900}
      LOGIN_MAX_FAILURES: ${SERVICE_API_LOGIN_MAX_FAILURES:-5}
      CAPTCHA_TTL_SECONDS: ${SERVICE_API_CAPTCHA_TTL_SECONDS:-120}
      CAPTCHA_RATE_LIMIT_WINDOW_SECONDS: ${SERVICE_API_CAPTCHA_RATE_LIMIT_WINDOW_SECONDS:-60}
      CAPTCHA_RATE_LIMIT_MAX: ${SERVICE_API_CAPTCHA_RATE_LIMIT_MAX:-20}
      CAPTCHA_HMAC_SECRET: ${SERVICE_API_CAPTCHA_HMAC_SECRET:?set SERVICE_API_CAPTCHA_HMAC_SECRET}
      REFRESH_RATE_LIMIT_WINDOW_SECONDS: ${SERVICE_API_REFRESH_RATE_LIMIT_WINDOW_SECONDS:-60}
      REFRESH_RATE_LIMIT_MAX: ${SERVICE_API_REFRESH_RATE_LIMIT_MAX:-30}
      REFRESH_RACE_GRACE_SECONDS: ${SERVICE_API_REFRESH_RACE_GRACE_SECONDS:-5}
      DATA_SYNC_INTERNAL_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN}
      BOOTSTRAP_ADMIN_ACCOUNT: ${BOOTSTRAP_ADMIN_ACCOUNT:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      HOME: /tmp
    networks:
      - service-api-internal
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: "no"

  service-api:
    image: quant-v2/service-api:local
    profiles: ["api"]
    depends_on:
      service-api-postgres:
        condition: service_healthy
      service-api-redis:
        condition: service_healthy
      service-api-migrate:
        condition: service_completed_successfully
      service-api-bootstrap:
        condition: service_completed_successfully
      data-sync-api:
        condition: service_healthy
    environment:
      PORT: 3000
      API_PREFIX: ${SERVICE_API_PREFIX:-api/v1}
      DATABASE_URL: postgresql://${SERVICE_API_POSTGRES_USER}:${SERVICE_API_POSTGRES_PASSWORD}@service-api-postgres:5432/${SERVICE_API_POSTGRES_DATABASE}
      REDIS_URL: redis://:${SERVICE_API_REDIS_PASSWORD}@service-api-redis:6379/0
      REDIS_KEY_PREFIX: ${SERVICE_API_REDIS_KEY_PREFIX:-quant-v2:api}
      JWT_ISSUER: ${SERVICE_API_JWT_ISSUER:-quant-v2}
      JWT_AUDIENCE: ${SERVICE_API_JWT_AUDIENCE:-quant-v2-web}
      JWT_ACCESS_SECRET: ${SERVICE_API_JWT_ACCESS_SECRET:?set SERVICE_API_JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${SERVICE_API_JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${SERVICE_API_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      COOKIE_SAME_SITE: ${SERVICE_API_COOKIE_SAME_SITE:-lax}
      LOGIN_FAILURE_WINDOW_SECONDS: ${SERVICE_API_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_LOCK_SECONDS: ${SERVICE_API_LOGIN_LOCK_SECONDS:-900}
      LOGIN_MAX_FAILURES: ${SERVICE_API_LOGIN_MAX_FAILURES:-5}
      CAPTCHA_TTL_SECONDS: ${SERVICE_API_CAPTCHA_TTL_SECONDS:-120}
      CAPTCHA_RATE_LIMIT_WINDOW_SECONDS: ${SERVICE_API_CAPTCHA_RATE_LIMIT_WINDOW_SECONDS:-60}
      CAPTCHA_RATE_LIMIT_MAX: ${SERVICE_API_CAPTCHA_RATE_LIMIT_MAX:-20}
      CAPTCHA_HMAC_SECRET: ${SERVICE_API_CAPTCHA_HMAC_SECRET:?set SERVICE_API_CAPTCHA_HMAC_SECRET}
      REFRESH_RATE_LIMIT_WINDOW_SECONDS: ${SERVICE_API_REFRESH_RATE_LIMIT_WINDOW_SECONDS:-60}
      REFRESH_RATE_LIMIT_MAX: ${SERVICE_API_REFRESH_RATE_LIMIT_MAX:-30}
      REFRESH_RACE_GRACE_SECONDS: ${SERVICE_API_REFRESH_RACE_GRACE_SECONDS:-5}
      DATA_SYNC_INTERNAL_BASE_URL: http://data-sync-api:8000
      DATA_SYNC_INTERNAL_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_PREFLIGHT_TIMEOUT_MS: ${DATA_SYNC_INTERNAL_PREFLIGHT_TIMEOUT_MS:-310000}
      STOCK_CONNECT_API_ENABLED: ${STOCK_CONNECT_API_ENABLED:-false}
      DATA_SYNC_STOCK_CONNECT_BASE_URL: http://data-sync-api:8000
      DATA_SYNC_STOCK_CONNECT_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN}
      DATA_SYNC_STOCK_CONNECT_TIMEOUT_MS: ${DATA_SYNC_STOCK_CONNECT_TIMEOUT_MS:-3000}
      DATA_SYNC_STOCK_CONNECT_CIRCUIT_FAILURES: ${DATA_SYNC_STOCK_CONNECT_CIRCUIT_FAILURES:-5}
      DATA_SYNC_STOCK_CONNECT_CIRCUIT_WINDOW_MS: ${DATA_SYNC_STOCK_CONNECT_CIRCUIT_WINDOW_MS:-30000}
      DATA_SYNC_STOCK_CONNECT_CIRCUIT_OPEN_MS: ${DATA_SYNC_STOCK_CONNECT_CIRCUIT_OPEN_MS:-30000}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:3000/health'',{method:''POST''}).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - service-api-internal
      - public
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  service-api-data-operations-dispatcher:
    image: quant-v2/service-api:local
    profiles: ["api"]
    command: ["node", "dist/scripts/dispatch-data-operations.js"]
    depends_on:
      service-api-postgres:
        condition: service_healthy
      service-api-redis:
        condition: service_healthy
      service-api-migrate:
        condition: service_completed_successfully
      service-api-bootstrap:
        condition: service_completed_successfully
      data-sync-api:
        condition: service_healthy
    environment:
      PORT: 3000
      API_PREFIX: ${SERVICE_API_PREFIX:-api/v1}
      DATABASE_URL: postgresql://${SERVICE_API_POSTGRES_USER}:${SERVICE_API_POSTGRES_PASSWORD}@service-api-postgres:5432/${SERVICE_API_POSTGRES_DATABASE}
      REDIS_URL: redis://:${SERVICE_API_REDIS_PASSWORD}@service-api-redis:6379/0
      REDIS_KEY_PREFIX: ${SERVICE_API_REDIS_KEY_PREFIX:-quant-v2:api}
      JWT_ISSUER: ${SERVICE_API_JWT_ISSUER:-quant-v2}
      JWT_AUDIENCE: ${SERVICE_API_JWT_AUDIENCE:-quant-v2-web}
      JWT_ACCESS_SECRET: ${SERVICE_API_JWT_ACCESS_SECRET:?set SERVICE_API_JWT_ACCESS_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${SERVICE_API_JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${SERVICE_API_REFRESH_TOKEN_TTL_SECONDS:-2592000}
      COOKIE_SAME_SITE: ${SERVICE_API_COOKIE_SAME_SITE:-lax}
      LOGIN_FAILURE_WINDOW_SECONDS: ${SERVICE_API_LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_LOCK_SECONDS: ${SERVICE_API_LOGIN_LOCK_SECONDS:-900}
      LOGIN_MAX_FAILURES: ${SERVICE_API_LOGIN_MAX_FAILURES:-5}
      CAPTCHA_TTL_SECONDS: ${SERVICE_API_CAPTCHA_TTL_SECONDS:-120}
      CAPTCHA_RATE_LIMIT_WINDOW_SECONDS: ${SERVICE_API_CAPTCHA_RATE_LIMIT_WINDOW_SECONDS:-60}
      CAPTCHA_RATE_LIMIT_MAX: ${SERVICE_API_CAPTCHA_RATE_LIMIT_MAX:-20}
      CAPTCHA_HMAC_SECRET: ${SERVICE_API_CAPTCHA_HMAC_SECRET:?set SERVICE_API_CAPTCHA_HMAC_SECRET}
      REFRESH_RATE_LIMIT_WINDOW_SECONDS: ${SERVICE_API_REFRESH_RATE_LIMIT_WINDOW_SECONDS:-60}
      REFRESH_RATE_LIMIT_MAX: ${SERVICE_API_REFRESH_RATE_LIMIT_MAX:-30}
      REFRESH_RACE_GRACE_SECONDS: ${SERVICE_API_REFRESH_RACE_GRACE_SECONDS:-5}
      DATA_SYNC_INTERNAL_BASE_URL: http://data-sync-api:8000
      DATA_SYNC_INTERNAL_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN}
    networks:
      - service-api-internal
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  data-sync-postgres:
    image: postgres:17.4-bookworm
    profiles: ["data-sync-infra"]
    environment:
      POSTGRES_DB: ${DATA_SYNC_POSTGRES_DATABASE:?set DATA_SYNC_POSTGRES_DATABASE}
      POSTGRES_PASSWORD: ${DATA_SYNC_POSTGRES_PASSWORD:?set DATA_SYNC_POSTGRES_PASSWORD}
      POSTGRES_USER: ${DATA_SYNC_POSTGRES_USER:?set DATA_SYNC_POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - data_sync_postgres:/var/lib/postgresql/data
    networks:
      - data-sync-internal
    restart: unless-stopped

  data-sync-redis:
    image: redis:7.4.2-alpine
    profiles: ["data-sync-infra"]
    command:
      [
        "/bin/sh",
        "-ec",
        'exec redis-server --appendonly yes --requirepass "$$DATA_SYNC_REDIS_PASSWORD"',
      ]
    environment:
      DATA_SYNC_REDIS_PASSWORD: ${DATA_SYNC_REDIS_PASSWORD:?set DATA_SYNC_REDIS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a $$DATA_SYNC_REDIS_PASSWORD ping | grep -q PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - data_sync_redis:/data
    networks:
      - data-sync-internal
    restart: unless-stopped

  data-sync-minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    profiles: ["data-sync-infra"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:9000/minio/health/live",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - data_sync_minio:/data
    networks:
      - data-sync-internal
    restart: unless-stopped

  data-sync-minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    profiles: ["data-sync-infra"]
    depends_on:
      data-sync-minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local http://data-sync-minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$$DATA_SYNC_S3_BUCKET"
        mc admin user add local "$$DATA_SYNC_S3_ACCESS_KEY" "$$DATA_SYNC_S3_SECRET_KEY"
        mc admin policy attach local readwrite --user "$$DATA_SYNC_S3_ACCESS_KEY"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      DATA_SYNC_S3_ACCESS_KEY: ${DATA_SYNC_S3_ACCESS_KEY:?set DATA_SYNC_S3_ACCESS_KEY}
      DATA_SYNC_S3_SECRET_KEY: ${DATA_SYNC_S3_SECRET_KEY:?set DATA_SYNC_S3_SECRET_KEY}
      DATA_SYNC_S3_BUCKET: ${DATA_SYNC_S3_BUCKET:?set DATA_SYNC_S3_BUCKET}
    networks:
      - data-sync-internal
    restart: "no"

  data-sync-migrate:
    image: quant-v2/service-data-sync:local
    profiles: ["api", "data-sync-api"]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      data-sync-postgres:
        condition: service_healthy
    environment:
      DATA_SYNC_ENV: local
      DATA_SYNC_DATABASE_URL: postgresql+psycopg://${DATA_SYNC_POSTGRES_USER}:${DATA_SYNC_POSTGRES_PASSWORD}@data-sync-postgres:5432/${DATA_SYNC_POSTGRES_DATABASE}
      DATA_SYNC_BROKER_URL: redis://:${DATA_SYNC_REDIS_PASSWORD}@data-sync-redis:6379/0
      DATA_SYNC_S3_ENDPOINT_URL: http://data-sync-minio:9000
      DATA_SYNC_S3_ACCESS_KEY: ${DATA_SYNC_S3_ACCESS_KEY:?set DATA_SYNC_S3_ACCESS_KEY}
      DATA_SYNC_S3_SECRET_KEY: ${DATA_SYNC_S3_SECRET_KEY:?set DATA_SYNC_S3_SECRET_KEY}
      DATA_SYNC_S3_BUCKET: ${DATA_SYNC_S3_BUCKET:?set DATA_SYNC_S3_BUCKET}
      DATA_SYNC_INTERNAL_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN}
    networks:
      - data-sync-internal
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: "no"

  data-sync-api:
    image: quant-v2/service-data-sync:local
    profiles: ["api", "data-sync-api"]
    command: ["data-sync-internal-api"]
    depends_on:
      data-sync-postgres:
        condition: service_healthy
      data-sync-migrate:
        condition: service_completed_successfully
    environment:
      <<: *stock-connect-data-sync-environment
      DATA_SYNC_ENV: local
      DATA_SYNC_LOG_LEVEL: ${DATA_SYNC_LOG_LEVEL:-INFO}
      DATA_SYNC_DATABASE_URL: postgresql+psycopg://${DATA_SYNC_POSTGRES_USER}:${DATA_SYNC_POSTGRES_PASSWORD}@data-sync-postgres:5432/${DATA_SYNC_POSTGRES_DATABASE}
      DATA_SYNC_BROKER_URL: redis://:${DATA_SYNC_REDIS_PASSWORD}@data-sync-redis:6379/0
      DATA_SYNC_S3_ENDPOINT_URL: http://data-sync-minio:9000
      DATA_SYNC_S3_ACCESS_KEY: ${DATA_SYNC_S3_ACCESS_KEY:?set DATA_SYNC_S3_ACCESS_KEY}
      DATA_SYNC_S3_SECRET_KEY: ${DATA_SYNC_S3_SECRET_KEY:?set DATA_SYNC_S3_SECRET_KEY}
      DATA_SYNC_S3_BUCKET: ${DATA_SYNC_S3_BUCKET:?set DATA_SYNC_S3_BUCKET}
      DATA_SYNC_S3_REGION: ${DATA_SYNC_S3_REGION:-us-east-1}
      DATA_SYNC_INTERNAL_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN}
      DATA_SYNC_AKSHARE_ENABLED: ${DATA_SYNC_AKSHARE_ENABLED:-false}
      DATA_SYNC_AKSHARE_REQUEST_TIMEOUT_SECONDS: ${DATA_SYNC_AKSHARE_REQUEST_TIMEOUT_SECONDS:-30}
      DATA_SYNC_EQUITY_MARKET_ENABLED: ${DATA_SYNC_EQUITY_MARKET_ENABLED:-false}
      DATA_SYNC_EQUITY_SCHEDULER_ENABLED: ${DATA_SYNC_EQUITY_SCHEDULER_ENABLED:-false}
      DATA_SYNC_SECTOR_ENABLED: ${DATA_SYNC_SECTOR_ENABLED:-false}
      DATA_SYNC_SECTOR_EOD_ENABLED: ${DATA_SYNC_SECTOR_EOD_ENABLED:-false}
      DATA_SYNC_SECTOR_EOD_PUBLISH_ENABLED: ${DATA_SYNC_SECTOR_EOD_PUBLISH_ENABLED:-false}
      DATA_SYNC_SECTOR_EOD_SCHEDULER_ENABLED: ${DATA_SYNC_SECTOR_EOD_SCHEDULER_ENABLED:-false}
      DATA_SYNC_TRADING_CALENDAR_ENABLED: ${DATA_SYNC_TRADING_CALENDAR_ENABLED:-false}
      DATA_SYNC_SECTOR_MEMBERSHIP_ENABLED: ${DATA_SYNC_SECTOR_MEMBERSHIP_ENABLED:-false}
      DATA_SYNC_SW_SECTOR_ENABLED: ${DATA_SYNC_SW_SECTOR_ENABLED:-false}
      DATA_SYNC_MONEY_FLOW_ENABLED: ${DATA_SYNC_MONEY_FLOW_ENABLED:-false}
      DATA_SYNC_FINANCIAL_ENABLED: ${DATA_SYNC_FINANCIAL_ENABLED:-false}
      DATA_SYNC_FINANCIAL_SOURCE_POLICY: ${DATA_SYNC_FINANCIAL_SOURCE_POLICY:-disabled}
      DATA_SYNC_FINANCIAL_MAX_CONCURRENCY: ${DATA_SYNC_FINANCIAL_MAX_CONCURRENCY:-1}
      DATA_SYNC_FINANCIAL_REQUESTS_PER_MINUTE: ${DATA_SYNC_FINANCIAL_REQUESTS_PER_MINUTE:-6}
      DATA_SYNC_FINANCIAL_REQUEST_TIMEOUT_SECONDS: ${DATA_SYNC_FINANCIAL_REQUEST_TIMEOUT_SECONDS:-300}
      DATA_SYNC_INDEX_ENABLED: ${DATA_SYNC_INDEX_ENABLED:-false}
      DATA_SYNC_INDEX_SOURCE_POLICY: ${DATA_SYNC_INDEX_SOURCE_POLICY:-disabled}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health').close()",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - data-sync-internal
      - service-api-internal
      - data-sync-egress
    volumes:
      - data_sync_stock_connect_config:/run/quant-v2/stock-connect-config:ro
      - data_sync_stock_connect_status:/var/lib/quant-v2/stock-connect-status:ro
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped

  data-sync-worker:
    image: quant-v2/service-data-sync:local
    profiles: ["data-sync-worker"]
    command: ["data-sync-worker"]
    depends_on:
      data-sync-postgres:
        condition: service_healthy
      data-sync-redis:
        condition: service_healthy
      data-sync-minio-init:
        condition: service_completed_successfully
    environment:
      <<: *stock-connect-data-sync-environment
      DATA_SYNC_LOG_LEVEL: ${DATA_SYNC_LOG_LEVEL:-INFO}
      DATA_SYNC_DATABASE_URL: postgresql+psycopg://${DATA_SYNC_POSTGRES_USER}:${DATA_SYNC_POSTGRES_PASSWORD}@data-sync-postgres:5432/${DATA_SYNC_POSTGRES_DATABASE}
      DATA_SYNC_BROKER_URL: redis://:${DATA_SYNC_REDIS_PASSWORD}@data-sync-redis:6379/0
      DATA_SYNC_S3_ENDPOINT_URL: http://data-sync-minio:9000
      DATA_SYNC_S3_ACCESS_KEY: ${DATA_SYNC_S3_ACCESS_KEY:?set DATA_SYNC_S3_ACCESS_KEY}
      DATA_SYNC_S3_SECRET_KEY: ${DATA_SYNC_S3_SECRET_KEY:?set DATA_SYNC_S3_SECRET_KEY}
      DATA_SYNC_S3_BUCKET: ${DATA_SYNC_S3_BUCKET:?set DATA_SYNC_S3_BUCKET}
      DATA_SYNC_S3_REGION: ${DATA_SYNC_S3_REGION:-us-east-1}
      DATA_SYNC_DIAGNOSTICS_TIMEOUT_SECONDS: ${DATA_SYNC_DIAGNOSTICS_TIMEOUT_SECONDS:-10}
      DATA_SYNC_AKSHARE_ENABLED: ${DATA_SYNC_AKSHARE_ENABLED:-false}
      DATA_SYNC_EQUITY_MARKET_ENABLED: ${DATA_SYNC_EQUITY_MARKET_ENABLED:-false}
      DATA_SYNC_EQUITY_SCHEDULER_ENABLED: ${DATA_SYNC_EQUITY_SCHEDULER_ENABLED:-false}
      DATA_SYNC_INDEX_ENABLED: ${DATA_SYNC_INDEX_ENABLED:-false}
      DATA_SYNC_INDEX_SOURCE_POLICY: ${DATA_SYNC_INDEX_SOURCE_POLICY:-disabled}
      DATA_SYNC_SECTOR_ENABLED: ${DATA_SYNC_SECTOR_ENABLED:-false}
      DATA_SYNC_SECTOR_EOD_ENABLED: ${DATA_SYNC_SECTOR_EOD_ENABLED:-false}
      DATA_SYNC_SECTOR_EOD_PUBLISH_ENABLED: ${DATA_SYNC_SECTOR_EOD_PUBLISH_ENABLED:-false}
      DATA_SYNC_SECTOR_EOD_SCHEDULER_ENABLED: ${DATA_SYNC_SECTOR_EOD_SCHEDULER_ENABLED:-false}
      DATA_SYNC_TRADING_CALENDAR_ENABLED: ${DATA_SYNC_TRADING_CALENDAR_ENABLED:-false}
      DATA_SYNC_SECTOR_MEMBERSHIP_ENABLED: ${DATA_SYNC_SECTOR_MEMBERSHIP_ENABLED:-false}
      DATA_SYNC_SW_SECTOR_ENABLED: ${DATA_SYNC_SW_SECTOR_ENABLED:-false}
      DATA_SYNC_MONEY_FLOW_ENABLED: ${DATA_SYNC_MONEY_FLOW_ENABLED:-false}
      DATA_SYNC_FINANCIAL_ENABLED: ${DATA_SYNC_FINANCIAL_ENABLED:-false}
      DATA_SYNC_FINANCIAL_SOURCE_POLICY: ${DATA_SYNC_FINANCIAL_SOURCE_POLICY:-disabled}
      DATA_SYNC_FINANCIAL_MAX_CONCURRENCY: ${DATA_SYNC_FINANCIAL_MAX_CONCURRENCY:-1}
      DATA_SYNC_FINANCIAL_REQUESTS_PER_MINUTE: ${DATA_SYNC_FINANCIAL_REQUESTS_PER_MINUTE:-6}
      DATA_SYNC_FINANCIAL_REQUEST_TIMEOUT_SECONDS: ${DATA_SYNC_FINANCIAL_REQUEST_TIMEOUT_SECONDS:-300}
      # Tushare token 只注入执行采集的 worker/scheduler；内部只读 API 不持有第三方凭据。
      DATA_SYNC_TUSHARE_ENABLED: ${DATA_SYNC_TUSHARE_ENABLED:-false}
      DATA_SYNC_MARKET_OVERVIEW_ENABLED: ${DATA_SYNC_MARKET_OVERVIEW_ENABLED:-false}
      DATA_SYNC_MARKET_DATA_LICENSE_SCOPE: ${DATA_SYNC_MARKET_DATA_LICENSE_SCOPE:-disabled}
      DATA_SYNC_MARKET_DATA_LICENSE_REFERENCE: ${DATA_SYNC_MARKET_DATA_LICENSE_REFERENCE:-}
      DATA_SYNC_TUSHARE_TOKEN: ${DATA_SYNC_TUSHARE_TOKEN:-}
      DATA_SYNC_TUSHARE_MINIMUM_ENTITLEMENT_POINTS: ${DATA_SYNC_TUSHARE_MINIMUM_ENTITLEMENT_POINTS:-6000}
      DATA_SYNC_TUSHARE_REQUEST_TIMEOUT_SECONDS: ${DATA_SYNC_TUSHARE_REQUEST_TIMEOUT_SECONDS:-30}
      DATA_SYNC_TUSHARE_RESPONSE_ROW_LIMIT: ${DATA_SYNC_TUSHARE_RESPONSE_ROW_LIMIT:-6000}
      DATA_SYNC_TUSHARE_MAX_REQUESTS_PER_MINUTE: ${DATA_SYNC_TUSHARE_MAX_REQUESTS_PER_MINUTE:-180}
      DATA_SYNC_TUSHARE_MAX_RETRIES: ${DATA_SYNC_TUSHARE_MAX_RETRIES:-3}
      DATA_SYNC_TUSHARE_RETRY_BASE_SECONDS: ${DATA_SYNC_TUSHARE_RETRY_BASE_SECONDS:-1.0}
      DATA_SYNC_INTERNAL_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_READ_API_BEARER_TOKEN}
      DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN: ${DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN:?set DATA_SYNC_INTERNAL_OPERATIONS_API_BEARER_TOKEN}
      DATA_SYNC_AKSHARE_REQUEST_TIMEOUT_SECONDS: ${DATA_SYNC_AKSHARE_REQUEST_TIMEOUT_SECONDS:-30}
      DATA_SYNC_ETF_PROVIDER_MIN_INTERVAL_SECONDS: ${DATA_SYNC_ETF_PROVIDER_MIN_INTERVAL_SECONDS:-0.25}
      DATA_SYNC_ETF_AUTO_RETRY_MAX_ATTEMPTS: ${DATA_SYNC_ETF_AUTO_RETRY_MAX_ATTEMPTS:-3}
      DATA_SYNC_ETF_AUTO_RETRY_BASE_SECONDS: ${DATA_SYNC_ETF_AUTO_RETRY_BASE_SECONDS:-2}
      DATA_SYNC_ETF_AUTO_RETRY_MAX_SECONDS: ${DATA_SYNC_ETF_AUTO_RETRY_MAX_SECONDS:-30}
    healthcheck:
      # 依赖就绪由启动依赖和 Data Operations preflight 验证；周期性诊断可能遗留不可取消的 I/O。
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 20s
    networks:
      - data-sync-internal
      - data-sync-egress
    volumes:
      - data_sync_stock_connect_config:/run/quant-v2/stock-connect-config:ro
      - data_sync_stock_connect_status:/var/lib/quant-v2/stock-connect-status:ro
    read_only: true
    tmpfs:
      - /tmp
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  data-sync-scheduler:
    extends:
      service: data-sync-worker
    command: ["data-sync-scheduler"]

networks:
  service-api-internal:
  data-sync-internal:
  public:
  data-sync-egress:

volumes:
  service_api_postgres:
  service_api_redis:
  data_sync_postgres:
  data_sync_redis:
  data_sync_minio:
  # 由授权交付/secret provisioner 填充；应用容器仅只读挂载，仓库不含持牌原始文件或密钥。
  data_sync_stock_connect_config:
  data_sync_stock_connect_status:
