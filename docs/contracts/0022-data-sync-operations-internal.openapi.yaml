            properties:
              partitionKey:
                type: string
              status:
                $ref: "#/components/schemas/RunStatus"
              attempt:
                type: integer
                minimum: 0
              checkpoint:
                oneOf:
                  - $ref: "#/components/schemas/CheckpointSummary"
                  - type: "null"
              error:
                oneOf:
                  - $ref: "#/components/schemas/ErrorSummary"
                  - type: "null"
        partitionsNextCursor:
          type: [string, "null"]
          maxLength: 1024
        timelineEventCount:
          type: integer
          minimum: 0
        timeline:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/OperationEvent"
        timelineNextCursor:
          type: [string, "null"]
          maxLength: 1024
        fencingToken:
          type: [integer, "null"]
          minimum: 1
    QualityGateDisposition:
      enum: [NOT_EVALUATED, PASSED, WARNED, BLOCKED]
    QualityGateSummary:
      type: object
