          $ref: "#/components/schemas/QualityGateDisposition"
        policyCode:
          type: [string, "null"]
          maxLength: 120
        policyVersion:
          type: [integer, "null"]
          minimum: 1
        affectedCount:
          type: [integer, "null"]
          minimum: 0
        error:
          oneOf:
