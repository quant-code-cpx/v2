      properties:
        runId:
          type: string
          format: uuid
        commandId:
          type: string
          format: uuid
        datasetCode:
          type: string
        mode:
          $ref: "#/components/schemas/SyncMode"
        status:
          $ref: "#/components/schemas/RunStatus"
        queuePosition:
          type: [integer, "null"]
          minimum: 1
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        progress:
          type: object
          additionalProperties: false
          required:
            [
              completedPartitions,
              totalPartitions,
              processedRecords,
              estimatedRecords,
            ]
          properties:
            completedPartitions:
              type: integer
              minimum: 0
            totalPartitions:
              type: integer
              minimum: 0
            processedRecords:
              type: integer
              minimum: 0
            estimatedRecords:
              type: [integer, "null"]
              minimum: 0
              description: Provider 无法可靠估算时为 null，UI 不显示虚假百分比
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorSummary"
            - type: "null"
    RunSearchRequest:
      allOf:
        - $ref: "#/components/schemas/CursorPageRequest"
        - type: object
          properties:
            datasetCodes:
              type: array
              maxItems: 100
              items:
                type: string
            statuses:
              type: array
              maxItems: 9
              items:
                $ref: "#/components/schemas/RunStatus"
            requestedFrom:
              type: [string, "null"]
              format: date-time
            requestedTo:
              type: [string, "null"]
              format: date-time
      unevaluatedProperties: false
    RunDetailRequest:
      type: object
      additionalProperties: false
      required: [runId]
      properties:
        runId:
          type: string
          format: uuid
        partitionsCursor:
          type: [string, "null"]
          maxLength: 1024
          description: 仅续取 partitions；与 timelineCursor 可独立或同时提供
        partitionsLimit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
        timelineCursor:
          type: [string, "null"]
          maxLength: 1024
          description: 仅续取 timeline；与 partitionsCursor 可独立或同时提供
        timelineLimit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
    RunPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/RunSummary"
        nextCursor:
          type: [string, "null"]
          maxLength: 1024
    CheckpointSummary:
      type: object
      additionalProperties: false
      description: 有界、脱敏的 checkpoint 摘要；不得返回 Provider cursor、token 或原始 payload
      required: [kind, positionHash, updatedAt]
      properties:
        kind:
          type: string
          minLength: 1
          maxLength: 40
        positionHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        updatedAt:
          type: string
          format: date-time
    RunDetail:
      type: object
      additionalProperties: false
      required:
        [
          run,
          target,
          sourceSnapshot,
          attempt,
          actorRef,
          qualityGate,
          partitionCount,
          partitions,
          partitionsNextCursor,
          timelineEventCount,
          timeline,
          timelineNextCursor,
          fencingToken,
        ]
      properties:
        run:
          $ref: "#/components/schemas/RunSummary"
        target:
          $ref: "#/components/schemas/SyncTarget"
        sourceSnapshot:
          type: array
          minItems: 1
          maxItems: 10
          description: 运行受理时冻结的 Provider、真实上游、adapter 与方法学版本
          items:
            $ref: "#/components/schemas/SourceBinding"
        attempt:
          type: integer
          minimum: 1
        actorRef:
          type: string
        qualityGate:
          $ref: "#/components/schemas/QualityGateSummary"
        partitionCount:
          type: integer
          minimum: 0
        partitions:
          type: array
