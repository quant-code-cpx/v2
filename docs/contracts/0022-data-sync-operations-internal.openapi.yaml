      required:
        [
          issueId,
          ruleCode,
          dimension,
          severity,
          status,
          firstDetectedAt,
          lastDetectedAt,
          affectedCount,
          evidenceSummary,
        ]
      properties:
        issueId:
          type: string
          format: uuid
        ruleCode:
          type: string
          maxLength: 120
        dimension:
          $ref: "#/components/schemas/HealthDimension"
        severity:
          enum: [WARN, CRITICAL]
        status:
          $ref: "#/components/schemas/HealthIssueStatus"
        firstDetectedAt:
          type: string
          format: date-time
        lastDetectedAt:
          type: string
          format: date-time
        affectedCount:
          type: [integer, "null"]
          minimum: 0
        evidenceSummary:
          type: [string, "null"]
          maxLength: 500
          description: 仅允许脱敏聚合证据，不返回原始记录或 Provider 正文
    HealthDimension:
      enum:
        [
          FRESHNESS,
          COMPLETENESS,
          VALIDITY,
          UNIQUENESS,
          CONSISTENCY,
          IDENTITY,
          SCHEMA,
          TEMPORAL,
        ]
    HealthSummary:
      type: object
      additionalProperties: false
      required:
        [
          status,
          score,
          evaluatedAt,
          evaluationId,
          warningCount,
          criticalCount,
          openIssueCount,
          affectedRecordCount,
        ]
      properties:
        status:
          $ref: "#/components/schemas/HealthStatus"
        score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
          description: UNKNOWN 且无法评分时为 null
        evaluatedAt:
          type: [string, "null"]
          format: date-time
        evaluationId:
          type: [string, "null"]
          format: uuid
        warningCount:
          type: integer
          minimum: 0
        criticalCount:
          type: integer
          minimum: 0
        openIssueCount:
          type: integer
          minimum: 0
        affectedRecordCount:
          type: [integer, "null"]
          minimum: 0
          description: 无法去重估算受影响记录时为 null
    HealthEvaluation:
      type: object
      additionalProperties: false
      description: 按 dataVersion、policyVersion 固化的不可变评估事实；当前问题状态由 HealthDetail 单独投影
      required:
        [
          evaluationId,
          healthCheckId,
          datasetCode,
          dataVersion,
          releaseId,
          policyCode,
          policyVersion,
          status,
          score,
          evaluatedAt,
          results,
        ]
      properties:
        evaluationId:
          type: string
          format: uuid
        healthCheckId:
          type: [string, "null"]
          format: uuid
          description: 主动健康检查生成时关联批次；同步发布后自动评估时为 null
        datasetCode:
          type: string
        dataVersion:
          type: string
          format: uuid
        releaseId:
          type: string
          format: uuid
        policyCode:
          type: string
        policyVersion:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/HealthStatus"
        score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        evaluatedAt:
          type: string
          format: date-time
        results:
          type: array
          maxItems: 500
          items:
            type: object
            additionalProperties: false
            required:
              [
                ruleCode,
                dimension,
                severity,
                status,
                expected,
                observed,
                affectedCount,
                sampleSummary,
                message,
              ]
            properties:
              ruleCode:
                type: string
              dimension:
                $ref: "#/components/schemas/HealthDimension"
              severity:
                enum: [INFO, WARN, CRITICAL]
              status:
                $ref: "#/components/schemas/HealthRuleStatus"
              expected:
                type: [string, "null"]
                maxLength: 300
              observed:
                type: [string, "null"]
                maxLength: 300
              affectedCount:
                type: [integer, "null"]
                minimum: 0
              sampleSummary:
                type: [string, "null"]
                maxLength: 500
                description: 仅返回脱敏、聚合后的安全样例摘要，不返回原始记录
              message:
                type: string
                maxLength: 500
    HealthEvaluationSummary:
      type: object
      additionalProperties: false
      description: 不含规则结果；评估事实固定，currentOpenIssueCount 是查询时的当前问题投影
      required:
        [
          evaluationId,
          healthCheckId,
          datasetCode,
          dataVersion,
          releaseId,
          policyCode,
          policyVersion,
          status,
          score,
          evaluatedAt,
          warningCount,
          criticalCount,
          currentOpenIssueCount,
          issueProjectionAsOf,
          affectedRecordCount,
        ]
      properties:
        evaluationId:
          type: string
          format: uuid
        healthCheckId:
          type: [string, "null"]
          format: uuid
        datasetCode:
          type: string
        dataVersion:
          type: string
          format: uuid
        releaseId:
          type: string
          format: uuid
        policyCode:
          type: string
        policyVersion:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/HealthStatus"
        score:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        evaluatedAt:
          type: string
          format: date-time
        warningCount:
          type: integer
          minimum: 0
        criticalCount:
          type: integer
          minimum: 0
        currentOpenIssueCount:
          type: integer
          minimum: 0
        issueProjectionAsOf:
          type: string
          format: date-time
        affectedRecordCount:
          type: [integer, "null"]
          minimum: 0
    HealthSearchRequest:
      allOf:
        - $ref: "#/components/schemas/CursorPageRequest"
        - type: object
          properties:
            datasetCodes:
              type: array
              maxItems: 100
              items:
                type: string
            statuses:
              type: array
              maxItems: 4
              items:
                $ref: "#/components/schemas/HealthStatus"
            evaluatedFrom:
              type: [string, "null"]
              format: date-time
            evaluatedTo:
              type: [string, "null"]
              format: date-time
      unevaluatedProperties: false
    HealthDetailRequest:
      type: object
      additionalProperties: false
      required: [evaluationId]
      properties:
        evaluationId:
          type: string
          format: uuid
        issuesCursor:
          type: [string, "null"]
          maxLength: 1024
        issuesLimit:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
    HealthPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/HealthEvaluationSummary"
        nextCursor:
          type: [string, "null"]
          maxLength: 1024
    HealthDetail:
      type: object
      additionalProperties: false
      description: 不可变评估事实与查询时开放问题投影的组合
      required:
        [
          evaluation,
          currentOpenIssueCount,
          currentOpenIssues,
          currentOpenIssuesNextCursor,
          issueProjectionAsOf,
        ]
      properties:
        evaluation:
          $ref: "#/components/schemas/HealthEvaluation"
        currentOpenIssueCount:
          type: integer
          minimum: 0
        currentOpenIssues:
          type: array
          maxItems: 100
          description: 仅含 OPEN、ACKNOWLEDGED；RESOLVED 只保留在内部历史与事件中
          items:
            $ref: "#/components/schemas/HealthIssueSummary"
        currentOpenIssuesNextCursor:
          type: [string, "null"]
          maxLength: 1024
        issueProjectionAsOf:
          type: string
          format: date-time
    HealthCheckTarget:
      type: object
      additionalProperties: false
      required: [datasetCode, dataVersion]
      properties:
        datasetCode:
          type: string
          minLength: 1
          maxLength: 160
        dataVersion:
          type: [string, "null"]
          format: uuid
          description: null 表示在受理时绑定该数据集的最新 production publication
    HealthCheckSubmitRequest:
      type: object
      additionalProperties: false
      required: [submissionId, targets, actor]
      properties:
        submissionId:
          type: string
          format: uuid
        targets:
          type: array
          minItems: 1
          maxItems: 100
          description: v1 同一批次 datasetCode 必须唯一，避免同一版本重复评估
          x-unique-by: datasetCode
          items:
            $ref: "#/components/schemas/HealthCheckTarget"
        actor:
          $ref: "#/components/schemas/ActorContext"
    HealthCheckStatus:
      enum: [QUEUED, RUNNING, SUCCEEDED, PARTIAL, FAILED, CANCELLED, REJECTED]
      description: >-
        全部目标成功为 SUCCEEDED；成功与非成功混合为 PARTIAL；无成功且含执行失败为 FAILED；
        全部取消为 CANCELLED；全部在执行前拒绝为 REJECTED
    HealthCheckTargetStatus:
      enum: [QUEUED, RUNNING, SUCCEEDED, FAILED, CANCELLED, REJECTED]
      description: 单目标从 QUEUED/RUNNING 进入一个终态；REJECTED 表示执行前未受理
    HealthCheckReceipt:
      type: object
      additionalProperties: false
      required: [healthCheckId, submissionId, status, acceptedAt]
      properties:
        healthCheckId:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/HealthCheckStatus"
        acceptedAt:
          type: string
          format: date-time
    HealthCheckDetailRequest:
      type: object
      additionalProperties: false
      required: [healthCheckId]
      properties:
        healthCheckId:
          type: string
          format: uuid
    HealthCheckTargetResult:
      type: object
      additionalProperties: false
      description: >-
        保留原提交 target；SUCCEEDED 必有 evaluationId，失败或拒绝必有 error，
        resolvedDataVersion 仅在目标版本成功绑定后有值
      required: [target, resolvedDataVersion, status, evaluationId, error]
      properties:
        target:
          $ref: "#/components/schemas/HealthCheckTarget"
        resolvedDataVersion:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/HealthCheckTargetStatus"
        evaluationId:
          type: [string, "null"]
          format: uuid
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorSummary"
            - type: "null"
      oneOf:
        - properties:
            status:
              const: QUEUED
            evaluationId:
              type: "null"
            error:
              type: "null"
        - properties:
            status:
              const: RUNNING
            resolvedDataVersion:
              type: string
              format: uuid
            evaluationId:
              type: "null"
            error:
              type: "null"
        - properties:
            status:
              const: SUCCEEDED
            resolvedDataVersion:
              type: string
              format: uuid
            evaluationId:
              type: string
              format: uuid
            error:
              type: "null"
        - properties:
            status:
              const: FAILED
            evaluationId:
              type: "null"
            error:
              $ref: "#/components/schemas/ErrorSummary"
        - properties:
            status:
              const: CANCELLED
            evaluationId:
              type: "null"
            error:
              type: "null"
        - properties:
            status:
              const: REJECTED
            resolvedDataVersion:
              type: "null"
            evaluationId:
              type: "null"
            error:
              $ref: "#/components/schemas/ErrorSummary"
    HealthCheckDetail:
      type: object
      additionalProperties: false
      description: targets 始终按原提交顺序返回，供 API 对账与 Web 展示批量结果
      required:
        [
          healthCheckId,
          submissionId,
          status,
          requestedAt,
          startedAt,
          finishedAt,
          actorRef,
          targets,
          error,
        ]
      properties:
        healthCheckId:
          type: string
          format: uuid
        submissionId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "#/components/schemas/HealthCheckStatus"
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        actorRef:
          type: string
          minLength: 1
          maxLength: 128
        targets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/HealthCheckTargetResult"
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorSummary"
            - type: "null"
    ScheduleFrequency:
      type: object
      additionalProperties: false
      required: [kind, timezone]
      properties:
        kind:
          enum: [TRADING_DAY, DAILY, WEEKLY, MONTHLY, INTERVAL]
        timezone:
          type: string
          minLength: 1
          maxLength: 80
          example: Asia/Shanghai
        localTime:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        dayOfWeek:
          type: [integer, "null"]
          minimum: 1
          maximum: 7
        dayOfMonth:
          type: [integer, "null"]
          minimum: 1
          maximum: 31
        intervalMinutes:
          type: [integer, "null"]
          minimum: 5
          maximum: 43200
        calendarCode:
          type: [string, "null"]
          maxLength: 80
      oneOf:
        - properties:
            kind:
              const: TRADING_DAY
            localTime:
              type: string
              pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
            dayOfWeek:
              type: "null"
            dayOfMonth:
              type: "null"
            intervalMinutes:
              type: "null"
            calendarCode:
              type: string
              minLength: 1
          required: [localTime, calendarCode]
        - properties:
            kind:
              const: DAILY
            localTime:
              type: string
              pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
            dayOfWeek:
              type: "null"
            dayOfMonth:
              type: "null"
            intervalMinutes:
              type: "null"
          required: [localTime]
        - properties:
            kind:
              const: WEEKLY
            localTime:
              type: string
              pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
            dayOfWeek:
              type: integer
              minimum: 1
              maximum: 7
            dayOfMonth:
              type: "null"
            intervalMinutes:
              type: "null"
          required: [localTime, dayOfWeek]
        - properties:
            kind:
              const: MONTHLY
            localTime:
              type: string
              pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
            dayOfWeek:
              type: "null"
            dayOfMonth:
              type: integer
              minimum: 1
              maximum: 31
            intervalMinutes:
              type: "null"
          required: [localTime, dayOfMonth]
        - properties:
            kind:
              const: INTERVAL
            localTime:
              type: "null"
            dayOfWeek:
              type: "null"
            dayOfMonth:
              type: "null"
            intervalMinutes:
              type: integer
              minimum: 5
              maximum: 43200
            calendarCode:
              type: "null"
          required: [intervalMinutes]
    ScheduleTargetPolicy:
      type: object
      additionalProperties: false
      required: [policyVersion, dateResolution]
      properties:
        policyVersion:
          type: integer
          minimum: 1
          description: 目标日期解析语义版本；修订计划时冻结
        dateResolution:
          enum: [NONE, SCHEDULED_LOCAL_DATE, LATEST_COMPLETED_TRADING_DATE]
      description: >-
        FULL 与 INCREMENTAL 必须使用 NONE；OBSERVATION_DATE 必须在计划触发时按计划本地日期
        或最近已完成交易日解析。首版自动计划禁止 DATE_RANGE。
    ScheduleTargetPolicyOption:
      type: object
      additionalProperties: false
      required: [mode, policy, isDefault]
      properties:
        mode:
          enum: [FULL, INCREMENTAL, OBSERVATION_DATE]
        policy:
          $ref: "#/components/schemas/ScheduleTargetPolicy"
        isDefault:
          type: boolean
      description: >-
        data-sync 返回的允许值；同一 mode 恰有一个默认项。ScheduleUpsertRequest.targetPolicy
        必须逐字段匹配所选数据集、mode 的一个当前允许项，真正受理时再次校验。
      oneOf:
        - properties:
            mode:
              enum: [FULL, INCREMENTAL]
            policy:
              allOf:
                - $ref: "#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      const: NONE
        - properties:
            mode:
              const: OBSERVATION_DATE
            policy:
              allOf:
                - $ref: "#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      enum:
                        [SCHEDULED_LOCAL_DATE, LATEST_COMPLETED_TRADING_DATE]
    ScheduleSummary:
      type: object
      additionalProperties: false
      description: v1 每个 datasetCode 至多一个计划，因此该摘要无歧义
      required: [scheduleId, enabled, frequency, nextRunAt, version]
      properties:
        scheduleId:
          type: string
          format: uuid
        enabled:
          type: boolean
        frequency:
          $ref: "#/components/schemas/ScheduleFrequency"
        nextRunAt:
          type: [string, "null"]
          format: date-time
        version:
          type: integer
          minimum: 1
    Schedule:
      type: object
      additionalProperties: false
      required:
        [
          summary,
          datasetCode,
          mode,
          targetPolicy,
          misfirePolicy,
          coalesce,
          recentRunAt,
          nextOccurrences,
          revisionId,
          updatedAt,
          updatedByActorRef,
        ]
      properties:
        summary:
          $ref: "#/components/schemas/ScheduleSummary"
        datasetCode:
          type: string
          description: v1 唯一计划键；创建重复 datasetCode 返回 409，更新不可改绑其他数据集
        mode:
          $ref: "#/components/schemas/SyncMode"
        targetPolicy:
          $ref: "#/components/schemas/ScheduleTargetPolicy"
        misfirePolicy:
          enum: [SKIP, RUN_ONCE]
        coalesce:
          type: boolean
        recentRunAt:
          type: [string, "null"]
          format: date-time
        nextOccurrences:
          type: array
          maxItems: 5
          items:
            type: string
            format: date-time
        revisionId:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
        updatedByActorRef:
          type: string
      oneOf:
        - properties:
            mode:
              enum: [FULL, INCREMENTAL]
            targetPolicy:
              allOf:
                - $ref: "#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      const: NONE
        - properties:
            mode:
              const: OBSERVATION_DATE
            targetPolicy:
              allOf:
                - $ref: "#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      enum:
                        [SCHEDULED_LOCAL_DATE, LATEST_COMPLETED_TRADING_DATE]
    ScheduleSearchRequest:
      allOf:
        - $ref: "#/components/schemas/CursorPageRequest"
        - type: object
          properties:
            datasetCodes:
              type: array
              maxItems: 100
              items:
                type: string
            enabled:
              type: [boolean, "null"]
      unevaluatedProperties: false
    ScheduleUpsertRequest:
      type: object
      additionalProperties: false
      required:
        [
          submissionId,
          scheduleId,
          datasetCode,
          mode,
          targetPolicy,
          frequency,
          misfirePolicy,
          coalesce,
          enabled,
          expectedVersion,
          actor,
        ]
      properties:
        submissionId:
          type: string
          format: uuid
        scheduleId:
          type: [string, "null"]
          format: uuid
          description: 创建时与 expectedVersion 同为 null；更新时两者都必须非 null
        datasetCode:
          type: string
          description: v1 每个 datasetCode 至多一个计划；创建重复值返回 409
        mode:
          $ref: "#/components/schemas/SyncMode"
        targetPolicy:
          $ref: "#/components/schemas/ScheduleTargetPolicy"
        frequency:
          $ref: "#/components/schemas/ScheduleFrequency"
        misfirePolicy:
          enum: [SKIP, RUN_ONCE]
        coalesce:
          type: boolean
        enabled:
          type: boolean
        expectedVersion:
          type: [integer, "null"]
          minimum: 1
          description: 创建时为 null，更新时必须等于当前版本
        actor:
          $ref: "#/components/schemas/ActorContext"
      oneOf:
        - properties:
            mode:
              enum: [FULL, INCREMENTAL]
            targetPolicy:
              allOf:
                - $ref: "#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      const: NONE
        - properties:
            mode:
              const: OBSERVATION_DATE
            targetPolicy:
              allOf:
                - $ref: "#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      enum:
                        [SCHEDULED_LOCAL_DATE, LATEST_COMPLETED_TRADING_DATE]
      allOf:
        - oneOf:
            - properties:
                scheduleId:
                  type: "null"
                expectedVersion:
                  type: "null"
            - properties:
                scheduleId:
                  type: string
                  format: uuid
                expectedVersion:
                  type: integer
                  minimum: 1
    ScheduleEnabledRequest:
      type: object
      additionalProperties: false
      required: [submissionId, scheduleId, enabled, expectedVersion, actor]
      properties:
        submissionId:
          type: string
          format: uuid
        scheduleId:
          type: string
          format: uuid
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
        actor:
          $ref: "#/components/schemas/ActorContext"
    SchedulePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/Schedule"
        nextCursor:
          type: [string, "null"]
          maxLength: 1024
    EventSearchRequest:
      allOf:
        - $ref: "#/components/schemas/CursorPageRequest"
        - type: object
          properties:
            actorRefs:
              type: array
              maxItems: 100
              items:
                type: string
            resourceTypes:
              type: array
              maxItems: 20
              items:
                enum: [COMMAND, RUN, HEALTH_CHECK, SCHEDULE]
            actions:
              type: array
              maxItems: 30
              items:
                type: string
            occurredFrom:
              type: [string, "null"]
              format: date-time
            occurredTo:
              type: [string, "null"]
              format: date-time
      unevaluatedProperties: false
    OperationEvent:
      type: object
      additionalProperties: false
      required:
        [
          eventId,
          resourceType,
          resourceId,
          action,
          result,
          actorRef,
          requestId,
          occurredAt,
          error,
        ]
      properties:
        eventId:
          type: string
          format: uuid
        resourceType:
          enum: [COMMAND, RUN, HEALTH_CHECK, SCHEDULE]
        resourceId:
          type: string
          format: uuid
        action:
          type: string
          maxLength: 80
        result:
          enum:
            [
              ACCEPTED,
              QUEUED,
              STARTED,
              CANCEL_REQUESTED,
              SUCCEEDED,
              PARTIAL,
              FAILED,
              CANCELLED,
              INTERRUPTED,
              SKIPPED,
              REJECTED,
            ]
          description: 动作事件结论而非资源终态；cancel_too_late 使用 FAILED，目标 run 可保持 SUCCEEDED
        actorRef:
          type: string
          maxLength: 128
        requestId:
          type: string
          maxLength: 128
        occurredAt:
          type: string
          format: date-time
        error:
          oneOf:
            - $ref: "#/components/schemas/ErrorSummary"
            - type: "null"
    EventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/OperationEvent"
        nextCursor:
          type: [string, "null"]
          maxLength: 1024
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 500
        code:
          type: string
          maxLength: 80
        requestId:
          type: string
          maxLength: 128
