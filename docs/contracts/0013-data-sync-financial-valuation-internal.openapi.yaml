            $ref: '#/components/schemas/InternalFinancialMetric'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        effectiveAsOf:
          type: string
          format: date
        knowledgeCutoff:
          type: string
          format: date-time

