    MarketOverview:
      type: object
      additionalProperties: false
      description: >-
        运行时还严格校验：首页四个稳定指数恰好各出现一次；宽度分项与 eligible 对账；
        complete bundle 的组件、来源绑定和通过数量一致；历史快照状态自洽；资金流流入项
        净额严格为正、流出项净额严格为负。
      required:
        [
          dataVersion,
          tradeDate,
          publishedAt,
          finality,
          status,
          indices,
          turnover,
          breadth,
          limits,
          marketMoneyFlow,
          equityMoneyFlowRankings,
          equityRankings,
          sectorRankings,
          attentionSignals,
          quality,
        ]
      properties:
        dataVersion:
          $ref: "#/components/schemas/Uuid"
        tradeDate:
          $ref: "#/components/schemas/DateOnly"
        publishedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        finality:
          const: final
        status:
          type: object
          additionalProperties: false
          required:
            [
              marketState,
              marketStateAsOf,
              marketStateMethodology,
              freshness,
              latestEligibleTradeDate,
              latestAttemptedTradeDate,
              lagTradingDays,
              eodEligibilityScheduleVersion,
              freshnessReason,
              quality,
            ]
          properties:
            marketState:
              enum: [pre_open, trading, lunch_break, closed, non_trading_day]
            marketStateAsOf:
              $ref: "#/components/schemas/OffsetDateTime"
            marketStateMethodology:
              const: calendar_schedule_derived
            freshness:
              enum: [current, stale]
            latestEligibleTradeDate:
              $ref: "#/components/schemas/DateOnly"
            latestAttemptedTradeDate:
              oneOf:
                - $ref: "#/components/schemas/DateOnly"
                - type: "null"
            lagTradingDays:
              type: integer
              minimum: 0
            eodEligibilityScheduleVersion:
              const: cn-a-eod-eligibility-2026-v1
            freshnessReason:
              enum:
                [
                  latest_eligible_complete,
                  latest_eligible_bundle_incomplete,
                  latest_eligible_bundle_unavailable,
                  publication_rollback,
                  historical_snapshot,
                ]
            quality:
              const: passed
        indices:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            additionalProperties: false
            required:
              [
                indexId,
                name,
                point,
                previousClose,
                change,
                changePercent,
                open,
                high,
                low,
                volume,
                volumeUnit,
                amountCny,
                source,
              ]
            properties:
              indexId:
                $ref: "#/components/schemas/MarketIndexId"
              name:
                type: string
                minLength: 1
                maxLength: 128
              point:
                $ref: "#/components/schemas/DecimalString"
              previousClose:
                $ref: "#/components/schemas/DecimalString"
              change:
                $ref: "#/components/schemas/DecimalString"
              changePercent:
                $ref: "#/components/schemas/DecimalString"
              open:
                $ref: "#/components/schemas/DecimalString"
              high:
                $ref: "#/components/schemas/DecimalString"
              low:
                $ref: "#/components/schemas/DecimalString"
              volume:
                oneOf:
                  - $ref: "#/components/schemas/DecimalString"
                  - type: "null"
              volumeUnit:
                const: lot
              amountCny:
                oneOf:
                  - $ref: "#/components/schemas/DecimalString"
                  - type: "null"
              source:
                $ref: "#/components/schemas/MarketSource"
        turnover:
          type: object
          additionalProperties: false
          required:
            [
              label,
              universe,
              methodologyId,
              sseAmountCny,
              szseAmountCny,
              totalAmountCny,
              previousTotalAmountCny,
              changeAmountCny,
              changePercent,
            ]
          properties:
            label:
              const: 沪深 A 股成交额
            universe:
              const: CN-A-SSE-SZSE
            methodologyId:
              const: sum-tushare-daily-a-share-amount-cny-v1
            sseAmountCny:
              $ref: "#/components/schemas/DecimalString"
            szseAmountCny:
              $ref: "#/components/schemas/DecimalString"
            totalAmountCny:
              $ref: "#/components/schemas/DecimalString"
            previousTotalAmountCny:
              $ref: "#/components/schemas/DecimalString"
            changeAmountCny:
              $ref: "#/components/schemas/DecimalString"
            changePercent:
              $ref: "#/components/schemas/DecimalString"
        breadth:
          type: object
          additionalProperties: false
          required: [eligible, advancing, flat, declining, suspended, unknown]
          properties:
            eligible:
              type: integer
              minimum: 0
            advancing:
              type: integer
