openapi: 3.1.0
x-http-method-policy: post-only
info:
  title: quant-v2 市场概览与行业板块公开业务 API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-contract-status: Accepted
  description: >-
    service-web 使用的市场概览、股票摘要排行、东财板块排行和申万行业详情公开合同。
    全部应用路由只声明 POST，响应只来自 service-data-sync 已完成并通过质量门的不可变
    publication；不以指数成分观察伪造指数行情，不以板块 EOD 推导全市场宽度，也不把
    供应商资金流标签描述为统一市场事实。本文档自包含当前公开 DTO 与严格响应边界。
servers:
  - url: /api/v1
security:
  - accessToken: []
paths:
  /market/overview:
    post:
      operationId: getMarketOverview
      summary: 查询市场首页原子完整包
      description: >-
        读取 latest complete bundle 或精确历史交易日 publication。响应中的指数、成交额、
        宽度、涨跌停、资金流、股票排行、板块排行和质量证据属于同一 dataVersion。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        $ref: "#/components/requestBodies/MarketOverviewQuery"
      responses:
        "200":
          $ref: "#/components/responses/MarketOverview"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/indices/{indexId}/bars:
    post:
      operationId: listMarketIndexBars
      summary: 查询主要指数日 K 线
      description: 只读取四个稳定指数身份的来源日行情，不接受供应商自由代码。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/MarketIndexId"
      requestBody:
        $ref: "#/components/requestBodies/MarketIndexBarsQuery"
      responses:
        "200":
          $ref: "#/components/responses/MarketIndexBars"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/equities/rankings:
    post:
      operationId: listMarketEquityRankings
      summary: 查询全市场股票摘要排行
      description: >-
        排名来自同一冻结沪深 A 股横截面，只提供市场摘要和股票中心深链接所需身份。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        $ref: "#/components/requestBodies/MarketEquityRankingsQuery"
      responses:
        "200":
          $ref: "#/components/responses/MarketEquityRankings"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/money-flow/equity-rankings:
    post:
      operationId: listMarketEquityMoneyFlowRankings
      summary: 查询供应商订单规模口径股票资金流排行
      description: >-
        direction 明确区分净流入与净流出；methodology 和 source 是响应事实的一部分，
        该口径不得与其他供应商或其他资金流语义直接合并。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        $ref: "#/components/requestBodies/MarketEquityMoneyFlowRankingsQuery"
      responses:
        "200":
          $ref: "#/components/responses/MarketEquityMoneyFlowRankings"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/calendar/query:
    post:
      operationId: queryMarketCalendar
      summary: 查询沪深交易日历和会话日程
      description: 返回 Asia/Shanghai 下的来源交易日历和版本化会话时段。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        $ref: "#/components/requestBodies/MarketCalendarQuery"
      responses:
        "200":
          $ref: "#/components/responses/MarketCalendar"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/sectors/strength:
    post:
      operationId: listMarketSectorStrength
      summary: 查询东财板块强弱与持续性排行
      description: >-
        行业与概念按各自 scheme 独立发布和排名。1、5、20 日窗口由同步服务物化，
        API 请求线程不临时扫描或聚合 EOD 数据。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        $ref: "#/components/requestBodies/MarketSectorStrengthQuery"
      responses:
        "200":
          $ref: "#/components/responses/MarketSectorStrength"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/sectors/money-flow-rankings:
    post:
      operationId: listMarketSectorMoneyFlowRankings
      summary: 查询东财来源板块资金流排行
      description: >-
        只按来源直报 canonical_net_amount 排名；价格强弱不会被替代为资金方向。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
      requestBody:
        $ref: "#/components/requestBodies/MarketSectorMoneyFlowRankingsQuery"
      responses:
        "200":
          $ref: "#/components/responses/MarketSectorMoneyFlowRankings"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/industries/sw/{code}/bars:
    post:
      operationId: listSwIndustryBars
      summary: 查询申万行业日、周、月 K 线
      description: >-
        周月 K 线必须是同步阶段已物化并结束的周期，不能由公开 API 请求临时聚合。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/SwIndustryCode"
      requestBody:
        $ref: "#/components/requestBodies/SwIndustryBarsQuery"
      responses:
        "200":
          $ref: "#/components/responses/SwIndustryBars"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/industries/sw/{code}/constituents:
    post:
      operationId: listSwIndustryConstituents
      summary: 查询申万行业正式成分页
      description: >-
        historyMode 固定为 latest_revision_effective_interval。成员有效区间是观察到的
        最新 revision 语义，不宣称为申万正式调入调出公告日期。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/SwIndustryCode"
      requestBody:
        $ref: "#/components/requestBodies/SwIndustryConstituentsQuery"
      responses:
        "200":
          $ref: "#/components/responses/SwIndustryConstituents"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /market/industries/sw/{code}/valuation:
    post:
      operationId: getSwIndustryValuation
      summary: 查询申万行业逐字段估值
      description: >-
        PE、PB 仅在来源报告时返回值；PE TTM 与股息率等来源未报告字段显式标记
        source_not_reported，禁止补零或跨方法学填充。
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/SwIndustryCode"
      requestBody:
        $ref: "#/components/requestBodies/SwIndustryValuationQuery"
      responses:
        "200":
          $ref: "#/components/responses/SwIndustryValuation"
        "204":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 可选调用方关联标识；缺省时由 API 生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: 上次 200 响应的强 ETag；命中同一请求维度与 publication 时返回 204。
      schema:
        type: string
        minLength: 3
        maxLength: 254
        pattern: '^"[^"\r\n]{1,252}"$'
    MarketIndexId:
      name: indexId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MarketIndexId"
    SwIndustryCode:
      name: code
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SwIndustryCode"
  headers:
    RequestId:
      description: 本次请求的关联标识；与服务间调用保持一致。
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
    DataVersion:
      description: 当前不可变 publication 的 UUID；必须与 200 响应体 dataVersion 相同。
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    EntityTag:
      description: service-data-sync 返回并由 service-api 原样保留的强 ETag。
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 254
        pattern: '^"[^"\r\n]{1,252}"$'
    SuccessCacheControl:
      description: POST 条件读取只允许用户私有缓存并要求重验证。
      required: true
      schema:
        const: "private, max-age=0, must-revalidate"
    ProblemCacheControl:
      description: 错误响应不得缓存。
      required: true
      schema:
        const: no-store
    RetryAfter:
      description: 仅在服务明确提供重试窗口时返回，单位为秒。
      schema:
        type: integer
        minimum: 1
  requestBodies:
    MarketOverviewQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketOverviewQuery"
    MarketIndexBarsQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketIndexBarsQuery"
    MarketEquityRankingsQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketEquityRankingsQuery"
    MarketEquityMoneyFlowRankingsQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketEquityMoneyFlowRankingsQuery"
    MarketCalendarQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketCalendarQuery"
    MarketSectorStrengthQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketSectorStrengthQuery"
    MarketSectorMoneyFlowRankingsQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketSectorMoneyFlowRankingsQuery"
    SwIndustryBarsQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryBarsQuery"
    SwIndustryConstituentsQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryConstituentsQuery"
    SwIndustryValuationQuery:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryValuationQuery"
  responses:
    MarketOverview:
      description: 单一 publication 市场首页完整包
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketOverview"
    MarketIndexBars:
      description: 主要指数日 K 线 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketIndexBarPage"
    MarketEquityRankings:
      description: 冻结沪深 A 股横截面排行 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketEquityRankingPage"
    MarketEquityMoneyFlowRankings:
      description: Tushare 订单规模语义股票资金流排行 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketEquityMoneyFlowRankingPage"
    MarketCalendar:
      description: 沪深交易日历与会话日程 publication
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketCalendarPage"
    MarketSectorStrength:
      description: 单一东财体系和完整窗口的板块强弱 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketSectorStrengthPage"
    MarketSectorMoneyFlowRankings:
      description: 单一东财体系的来源资金流 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketSectorMoneyFlowRankingPage"
    SwIndustryBars:
      description: 申万行业已物化 K 线 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryBarPage"
    SwIndustryConstituents:
      description: 申万行业最新 revision 有效区间成分页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryConstituentPage"
    SwIndustryValuation:
      description: 申万行业逐字段可解释估值 publication
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryValuation"
    NotModified:
      description: If-None-Match 命中；公开 POST 返回 204 且响应体为空。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
    Problem:
      description: >-
        当前实现实际可达的 RFC 9457 Problem Details。只包括 400、401、404、
        409、424、503；具体路由仅声明其可达状态。client 对下游 429 的防御映射
        不代表当前内部读取路由或本模块公开路由存在限流器。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/ProblemCacheControl"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Uuid:
      type: string
      format: uuid
    DateOnly:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
    OffsetDateTime:
      type: string
      format: date-time
      description: 必须显式携带 UTC 标识或时区偏移。
    DecimalString:
      type: string
      pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?$'
      description: 规范十进制字符串；禁止 JSON number 造成金额、点位或百分比精度丢失。
    UnitIntervalDecimalString:
      type: string
      pattern: '^(?:-?0(?:\.0+)?|0\.\d+|1(?:\.0+)?)$'
      description: 包含端区间 0 至 1 的规范十进制字符串；与运行时一致保留负零表示。
    MarketIndexId:
      enum: [sse-composite, szse-component, csi-300, chinext]
    SwIndustryCode:
      type: string
      pattern: '^[0-9]{6}\.SI$'
    MarketScheme:
      enum: [eastmoney.industry, eastmoney.concept]
    MarketOverviewQuery:
      type: object
      additionalProperties: false
      properties:
        asOf:
          $ref: "#/components/schemas/DateOnly"
    MarketIndexBarsQuery:
      type: object
      additionalProperties: false
      required: [start, end]
      properties:
        start:
          $ref: "#/components/schemas/DateOnly"
        end:
          $ref: "#/components/schemas/DateOnly"
        cursor:
          type: string
          minLength: 1
          maxLength: 2048
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 250
        period:
          const: 1d
          default: 1d
    MarketEquityRankingsQuery:
      type: object
      additionalProperties: false
      required: [metric, order]
      properties:
        asOf:
          $ref: "#/components/schemas/DateOnly"
        metric:
          enum: [changePercent, amountCny, turnoverPercent]
        order:
          enum: [asc, desc]
        cursor:
          type: string
          minLength: 1
          maxLength: 2048
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
    MarketEquityMoneyFlowRankingsQuery:
      type: object
      additionalProperties: false
      required: [direction]
      properties:
        asOf:
          $ref: "#/components/schemas/DateOnly"
        direction:
          enum: [inflow, outflow]
        cursor:
          type: string
