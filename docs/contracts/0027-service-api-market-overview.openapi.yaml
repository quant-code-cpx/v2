          type: string
          minLength: 1
          maxLength: 32
        periodStart:
          $ref: "#/components/schemas/DateOnly"
        periodEnd:
          $ref: "#/components/schemas/DateOnly"
        open:
          $ref: "#/components/schemas/DecimalString"
        high:
          $ref: "#/components/schemas/DecimalString"
        low:
          $ref: "#/components/schemas/DecimalString"
        close:
          $ref: "#/components/schemas/DecimalString"
        change:
          $ref: "#/components/schemas/DecimalString"
        changePercent:
          $ref: "#/components/schemas/DecimalString"
        volume:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        amountCny:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        previousClose:
          $ref: "#/components/schemas/DecimalString"
        amplitudePercent:
          $ref: "#/components/schemas/DecimalString"
        turnoverPercent:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
        isFinal:
          const: true
    SwIndustryConstituentPage:
      type: object
      additionalProperties: false
      description: >-
        inputDataVersions 必须是两个不重复 UUID。运行时校验每个有效成员的半开区间
        [inDate, outDate) 包含 snapshotDate，且同时存在时 inDate 严格早于 outDate。
      required:
        [
          dataVersion,
          snapshotDate,
          publishedAt,
          historyMode,
          knowledgeCutoff,
          observedAt,
          industry,
          source,
          methodology,
          inputDataVersions,
          items,
          nextCursor,
        ]
      properties:
        dataVersion:
          $ref: "#/components/schemas/Uuid"
        snapshotDate:
          $ref: "#/components/schemas/DateOnly"
        publishedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        historyMode:
          const: latest_revision_effective_interval
        knowledgeCutoff:
          $ref: "#/components/schemas/OffsetDateTime"
        observedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        industry:
          $ref: "#/components/schemas/IndustryIdentity"
        source:
          $ref: "#/components/schemas/MarketSource"
        methodology:
          type: object
          additionalProperties: false
          required: [id, version, status, temporalSemantics]
          properties:
            id:
              const: quant-v2.sw-membership.v1
            version:
              const: "1"
            status:
              const: source_reported
            temporalSemantics:
              const: latest_revision_effective_interval
        inputDataVersions:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
        items:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [exchange, symbol, name, inDate, outDate, isActive]
            properties:
              exchange:
                enum: [SSE, SZSE, BSE]
              symbol:
                type: string
                pattern: "^[0-9]{6}$"
              name:
                type: string
                minLength: 1
                maxLength: 128
              inDate:
                oneOf:
                  - $ref: "#/components/schemas/DateOnly"
                  - type: "null"
              outDate:
                oneOf:
                  - $ref: "#/components/schemas/DateOnly"
                  - type: "null"
              isActive:
                const: true
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2048
            - type: "null"
