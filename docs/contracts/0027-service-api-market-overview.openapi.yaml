    SwIndustryBarPage:
      type: object
      additionalProperties: false
      description: >-
        运行时按 period 校验方法学组合：1d 必须 source-reported-daily-bar；
        1w/1mo 必须 calendar-bounded-ohlcv-aggregation。每项周期与页面周期一致，
        日线起止日相同，所有周期均已结束。
      required:
        [
          dataVersion,
          publishedAt,
          industry,
          period,
          volumeUnit,
          source,
          methodology,
          inputDataVersions,
          finality,
          items,
          nextCursor,
        ]
      properties:
        dataVersion:
          $ref: "#/components/schemas/Uuid"
        publishedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        industry:
          $ref: "#/components/schemas/IndustryIdentity"
        period:
          enum: [1d, 1w, 1mo]
        volumeUnit:
          const: provider_native
        source:
          $ref: "#/components/schemas/MarketSource"
        methodology:
          oneOf:
            - $ref: "#/components/schemas/SwDailyBarMethodology"
            - $ref: "#/components/schemas/SwAggregatedBarMethodology"
        inputDataVersions:
          type: array
          minItems: 1
          maxItems: 7500
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Uuid"
        finality:
          const: final
        items:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/SwIndustryBar"
        nextCursor:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2048
            - type: "null"
    SwDailyBarMethodology:
      type: object
      additionalProperties: false
      required: [id, version, status, inputDataset, previousClose]
      properties:
        id:
          const: source-reported-daily-bar
        version:
          const: "1"
        status:
          const: source_reported
        inputDataset:
          const: sw.market-data
        previousClose:
          type: object
