openapi: 3.1.1
info:
  title: service-api sector market-data API
  version: 1.0.0
  description: |
    Implemented authenticated public API for published sector catalogs and direct
    upstream daily, weekly, and monthly bars. service-api owns this projection;
    service-data-sync remains canonical owner and is accessed only through its
    versioned internal HTTP contract.
  x-contract-status: Implemented
servers:
  - url: /api/v1
tags:
  - name: market-sectors
security:
  - userBearer: []
paths:
  /market/sectors:
    get:
      tags: [market-sectors]
      operationId: listMarketSectors
      summary: List published sectors from one explicit classification scheme
      parameters:
        - $ref: '#/components/parameters/Scheme'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize100'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Cursor page ordered by code and stable internal identity.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorPage'
        '304':
          description: Representation matches If-None-Match.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /market/sectors/{scheme}/{sectorCode}/bars:
    get:
      tags: [market-sectors]
      operationId: listMarketSectorBars
      summary: Read direct upstream daily, weekly, or monthly bars for one sector
      description: |
        start and end are inclusive and mandatory. period is a direct upstream dataset,
        never a local daily aggregation. Public callers cannot request raw evidence,
        provider names, database IDs, or unpublished revisions.
      parameters:
        - $ref: '#/components/parameters/SchemePath'
        - $ref: '#/components/parameters/SectorCode'
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize1000'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Ascending period-end page from one published data version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorBarPage'
        '304':
          description: Representation matches If-None-Match.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SnapshotExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'
components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Existing authenticated service-api session. Final market-data permission policy is pending ADR-0011 review.
  parameters:
    Scheme:
      name: scheme
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/SectorScheme'
    SchemePath:
      name: scheme
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SectorScheme'
    SectorCode:
      name: sectorCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Query:
      name: query
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Period:
      name: period
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/BarPeriod'
    StartDate:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    PageSize100:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageSize1000:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
  headers:
    ETag:
      schema:
        type: string
    PrivateRevalidate:
      schema:
        type: string
        example: private, max-age=0, must-revalidate
  responses:
    ValidationProblem:
      description: Request input, cursor, or bounded date range is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid user session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks final market-data read permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Published active sector or selected period is absent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SnapshotExpired:
      description: Cursor points to a superseded publication; restart from first page.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Caller exceeded market-data read budget.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DataSyncUnavailable:
      description: Canonical downstream read service is unavailable; no unmarked stale value is returned.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SectorScheme:
      type: string
      enum: [eastmoney.industry, eastmoney.concept]
    BarPeriod:
      type: string
      enum: [1d, 1w, 1mo]
    DecimalString:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    NonNegativeDecimalString:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
    Sector:
      type: object
      required: [scheme, code, name, dataVersion, publishedAt]
      additionalProperties: false
      properties:
        scheme:
          $ref: '#/components/schemas/SectorScheme'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
    SectorPage:
      type: object
      required: [items, nextCursor, dataVersion, publishedAt]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Sector'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
    SectorBar:
      type: object
      required: [periodEnd, open, high, low, close, volumeValue, volumeUnit, amountCny, isFinal]
      additionalProperties: false
      properties:
        periodEnd:
          type: string
          format: date
        open:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        high:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        low:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        close:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        volumeValue:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        volumeUnit:
          type: string
          const: provider_native
          description: Retained source unit; clients must not aggregate it across schemes.
        amountCny:
          $ref: '#/components/schemas/NonNegativeDecimalString'
        amplitudePercent:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeDecimalString'
            - type: 'null'
        changePercent:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        changeAmount:
          oneOf:
            - $ref: '#/components/schemas/DecimalString'
            - type: 'null'
        turnoverPercent:
          oneOf:
            - $ref: '#/components/schemas/NonNegativeDecimalString'
            - type: 'null'
        isFinal:
          type: boolean
    SectorBarPage:
      type: object
      required: [sector, period, dataVersion, publishedAt, items, nextCursor]
      additionalProperties: false
      properties:
        sector:
          $ref: '#/components/schemas/Sector'
        period:
          $ref: '#/components/schemas/BarPeriod'
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/SectorBar'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      additionalProperties: false
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
