openapi: 3.1.1
info:
  title: service-data-sync sector membership internal API
  version: 1.0.0
  description: |
    Implemented additive companion to 0005-data-sync-sector-internal.openapi.yaml.
    It adds observed sector-membership reads only; it neither replaces nor copies
    sector catalog or bar operations. Returned records have verified canonical
    equity identities. PENDING and quarantined identities are excluded.
  x-contract-status: Implemented
servers:
  - url: http://service-data-sync:8000
    description: Compose internal service network
tags:
  - name: sector-membership
security:
  - serviceBearer: []
paths:
  /internal/v1/sectors/{scheme}/{sectorCode}/constituents:
    get:
      tags: [sector-membership]
      operationId: listInternalSectorConstituents
      summary: List verified constituents from one published observation release
      description: |
        asOf selects the latest immutable release whose releaseAsOf does not exceed
        the requested instant. Omitted asOf selects the current release. The temporal
        fields are observation boundaries, not true inclusion or removal dates.
      parameters:
        - $ref: '#/components/parameters/SchemePath'
        - $ref: '#/components/parameters/SectorCode'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Page ordered by exchange, symbol, and stable instrument identifier.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SectorConstituentPage'
        '304':
          description: Representation matches If-None-Match.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SnapshotExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /internal/v1/equities/{exchange}/{symbol}/sectors:
    get:
      tags: [sector-membership]
      operationId: listInternalEquitySectors
      summary: List sectors containing one verified equity at an observation instant
      description: |
        scheme is mandatory so one response is bound to one release and dataVersion.
        An equity that is absent from the selected release returns an empty items array;
        an unknown or non-public canonical identity returns 404.
      parameters:
        - $ref: '#/components/parameters/Exchange'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/SchemeQuery'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Page ordered by sector code and stable sector identifier.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquitySectorPage'
        '304':
          description: Representation matches If-None-Match.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SnapshotExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
      bearerFormat: service-credential
      description: Runtime-injected internal credential compared in constant time.
  parameters:
    SchemePath:
      name: scheme
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/SectorScheme'
    SchemeQuery:
      name: scheme
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/SectorScheme'
    SectorCode:
      name: sectorCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      description: Stable code within scheme; never a display name.
    Exchange:
      name: exchange
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Exchange'
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{6}$'
    AsOf:
      name: asOf
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: RFC 3339 instant with offset; defaults to the current published release.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Opaque cursor bound to route, filters, selected release, and dataVersion.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
  headers:
    ETag:
      schema:
        type: string
      description: Strong tag derived from route projection, filters, cursor, and dataVersion.
    PrivateRevalidate:
      schema:
        type: string
        const: private, max-age=0, must-revalidate
  responses:
    ValidationProblem:
      description: Path, query, timestamp, limit, or cursor is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid service credential.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Sector, verified equity, release, or requested history coverage is absent.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SnapshotExpired:
      description: Cursor dataVersion is no longer current; restart from the first page.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Internal caller exceeded its approved read budget.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: Published read store or required internal dependency is unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    SectorScheme:
      type: string
      enum: [eastmoney.industry, eastmoney.concept]
    Exchange:
      type: string
      enum: [SSE, SZSE, BSE]
    ListingStatus:
      type: string
      enum: [LISTED, SUSPENDED, DELISTED]
      description: PENDING is intentionally excluded from this contract.
    MembershipSemantics:
      type: string
      const: observed
    QualityStatus:
      type: string
      enum: [passed, warned]
    SectorRef:
      type: object
      additionalProperties: false
      required: [sectorId, scheme, code, name]
      properties:
        sectorId:
          type: string
          format: uuid
        scheme:
          $ref: '#/components/schemas/SectorScheme'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
    EquityRef:
      type: object
      additionalProperties: false
      required: [instrumentId, exchange, symbol, name, listingStatus]
      properties:
        instrumentId:
          type: string
          format: uuid
        exchange:
          $ref: '#/components/schemas/Exchange'
        symbol:
          type: string
          pattern: '^[0-9]{6}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        listingStatus:
          $ref: '#/components/schemas/ListingStatus'
    ReleaseContext:
      type: object
      additionalProperties: false
      required:
        - requestedAsOf
        - resolvedAsOf
        - coverageStart
        - membershipSemantics
        - qualityStatus
        - identityCoveragePercent
        - excludedIdentityCount
        - carriedForwardSectorCount
        - dataVersion
        - publishedAt
      properties:
        requestedAsOf:
          type: [string, 'null']
          format: date-time
        resolvedAsOf:
          type: string
          format: date-time
          description: releaseAsOf of the immutable manifest selected for this response.
        coverageStart:
          type: string
          format: date-time
        membershipSemantics:
          $ref: '#/components/schemas/MembershipSemantics'
        qualityStatus:
          $ref: '#/components/schemas/QualityStatus'
        identityCoveragePercent:
          type: string
          const: '100'
          description: Consumer-visible releases contain only fully resolved snapshots.
        excludedIdentityCount:
          type: integer
          const: 0
          description: Published snapshots require 100% canonical identity resolution.
        carriedForwardSectorCount:
          type: integer
          minimum: 0
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
    ObservationWindow:
      type: object
      additionalProperties: false
      required: [observedFrom, observedTo]
      properties:
        observedFrom:
          type: string
          format: date-time
        observedTo:
          type: [string, 'null']
          format: date-time
          description: First later complete observation where the relationship was absent.
    InternalConstituent:
      type: object
      additionalProperties: false
      required:
        [instrumentId, exchange, symbol, name, listingStatus, observedFrom, observedTo]
      properties:
        instrumentId:
          type: string
          format: uuid
        exchange:
          $ref: '#/components/schemas/Exchange'
        symbol:
          type: string
          pattern: '^[0-9]{6}$'
        name:
          type: string
          minLength: 1
          maxLength: 200
        listingStatus:
          $ref: '#/components/schemas/ListingStatus'
        observedFrom:
          type: string
          format: date-time
        observedTo:
          type: [string, 'null']
          format: date-time
          description: First later complete observation where the relationship was absent.
    InternalSectorMembership:
      type: object
      additionalProperties: false
      required:
        - sectorId
        - scheme
        - code
        - name
        - observedFrom
        - observedTo
        - snapshotObservedAt
        - carriedForward
      properties:
        sectorId:
          type: string
          format: uuid
        scheme:
          $ref: '#/components/schemas/SectorScheme'
        code:
          type: string
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 200
        observedFrom:
          type: string
          format: date-time
        observedTo:
          type: [string, 'null']
          format: date-time
        snapshotObservedAt:
          type: string
          format: date-time
        carriedForward:
          type: boolean
    SectorConstituentPage:
      type: object
      additionalProperties: false
      required: [sector, release, snapshotObservedAt, carriedForward, items, nextCursor]
      properties:
        sector:
          $ref: '#/components/schemas/SectorRef'
        release:
          $ref: '#/components/schemas/ReleaseContext'
        snapshotObservedAt:
          type: string
          format: date-time
        carriedForward:
          type: boolean
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/InternalConstituent'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
    EquitySectorPage:
      type: object
      additionalProperties: false
      required: [equity, scheme, release, items, nextCursor]
      properties:
        equity:
          $ref: '#/components/schemas/EquityRef'
        scheme:
          $ref: '#/components/schemas/SectorScheme'
        release:
          $ref: '#/components/schemas/ReleaseContext'
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/InternalSectorMembership'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        requestId:
          type: string
