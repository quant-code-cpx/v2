openapi: 3.1.1
info:
  title: service-api financial statement and valuation API
  version: 2.0.0
  description: |
    Implemented authenticated public API for published A-share financial
    statements, governed financial metrics, and explicit valuation methodology
    series. service-api owns authentication, authorization, abuse controls, and
    public projection. It reads canonical data only through contract 0013.

    This contract replaces the financial-report and financial-metric paths in
    proposed contract 0004 with exchange-plus-symbol identities and adds the
    valuation path. Other equity paths remain unaffected. Public responses omit
    internal instrument IDs, database keys, provider identities, source batch
    IDs, raw evidence, and quarantine details.
  x-contract-status: Implemented
  x-partially-supersedes: 0004-service-api-equity.openapi.yaml
  x-replaces-paths:
    - /equities/{instrumentId}/financial-reports
    - /equities/{instrumentId}/financial-reports/{reportId}
    - /equities/{instrumentId}/financial-metrics
x-http-method-policy: post-only
servers:
  - url: /api/v1
tags:
  - name: equity-financial-reports
  - name: equity-financial-metrics
  - name: equity-valuations
security:
  - userBearer: []
paths:
  /equities/{exchange}/{symbol}/financial-reports:
    post:
      tags: [equity-financial-reports]
      operationId: listEquityFinancialReportsV2
      summary: List published financial statements without look-ahead
      description: |
        reportPeriod is an accounting period, not an availability date. asOf
        selects the business-effective view and knownAt restricts results to
        platform knowledge available by that instant. methodologyCode and
        methodologyVersion are mandatory, so one page maps to one publication.
        Cursor binds all filters, time cutoffs, sort keys, and dataVersion.
      parameters:
        - $ref: '#/components/parameters/ExchangePath'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/StatementTypes'
        - $ref: '#/components/parameters/PeriodBases'
        - $ref: '#/components/parameters/StatementScope'
        - $ref: '#/components/parameters/MethodologyCode'
        - $ref: '#/components/parameters/MethodologyVersion'
        - $ref: '#/components/parameters/ReportPeriodFrom'
        - $ref: '#/components/parameters/ReportPeriodTo'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit50'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Page ordered by reportPeriod descending, statementType, and reportRef.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialReportPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CursorMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /equities/{exchange}/{symbol}/financial-reports/{reportRef}:
    post:
      tags: [equity-financial-reports]
      operationId: getEquityFinancialReportV2
      summary: Read one governed page of a published financial statement
      description: |
        reportRef is a public-safe opaque identity. Omit metric to page through
        all governed line items. Unknown and quarantined upstream fields are not
        exposed.
      parameters:
        - $ref: '#/components/parameters/ExchangePath'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/ReportRef'
        - $ref: '#/components/parameters/MetricCodes100Optional'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit200'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: One statement header and one line-item page.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialReportDetail'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CursorMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /equities/{exchange}/{symbol}/financial-metrics:
    post:
      tags: [equity-financial-metrics]
      operationId: listEquityFinancialMetricsV2
      summary: Read one explicit provider or derived metric family
      description: |
        origin, methodologyCode, methodologyVersion, and metric are mandatory.
        Provider-reported and platform-derived values never form one implicit
        series, even when labels match. PLATFORM_DERIVED methodology
        platform.financial-derivation version 1 publishes
        platform.operating_revenue.single_quarter,
        platform.operating_revenue.ttm,
        platform.net_profit_parent.single_quarter, and
        platform.net_profit_parent.ttm. Single-quarter Q1 equals current YTD;
        Q2-Q4 equal current YTD minus previous-quarter YTD. TTM Q4 equals
        current YTD; Q1-Q3 equal current YTD plus prior annual YTD minus the
        prior-year same-quarter YTD. Every input must share unit and currency;
        any missing dependency omits that output instead of substituting zero.
      parameters:
        - $ref: '#/components/parameters/ExchangePath'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/MetricOrigin'
        - $ref: '#/components/parameters/MethodologyCode'
        - $ref: '#/components/parameters/MethodologyVersion'
        - $ref: '#/components/parameters/MetricCodes50'
        - $ref: '#/components/parameters/PeriodBases'
        - $ref: '#/components/parameters/ReportPeriodFrom'
        - $ref: '#/components/parameters/ReportPeriodTo'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit500'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Page ordered by reportPeriod ascending, metricCode, and methodologyVersion.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialMetricPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CursorMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /equities/{exchange}/{symbol}/valuations:
    post:
      tags: [equity-valuations]
      operationId: listEquityValuationObservations
      summary: Read one explicit valuation methodology series
      description: |
        methodologyCode, methodologyVersion, and metric are mandatory. No source
        or methodology fallback occurs. start and end are inclusive and may span
        at most 3660 days. Observation dates are not presented as
        exchange-official final values.
      parameters:
        - $ref: '#/components/parameters/ExchangePath'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/MethodologyCode'
        - $ref: '#/components/parameters/MethodologyVersion'
        - $ref: '#/components/parameters/ValuationMetrics'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit1000'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Page ordered by observationDate ascending and metricCode.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValuationPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/CursorMismatch'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Existing authenticated service-api session. Proposed initial policy
        permits active USER, ADMIN, and SUPER_ADMIN roles to read.

  parameters:
    ExchangePath:
      name: exchange
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Exchange'
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Symbol'
    ReportRef:
      name: reportRef
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Public-safe opaque report identity; not an internal instrument or database ID.
    StatementTypes:
      name: statementType
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items:
          $ref: '#/components/schemas/StatementType'
    PeriodBases:
      name: basis
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          $ref: '#/components/schemas/PeriodBasis'
    StatementScope:
      name: scope
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/StatementScope'
    MetricOrigin:
      name: origin
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/MetricOrigin'
    MetricCodes50:
      name: metric
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 50
        uniqueItems: true
        items:
          $ref: '#/components/schemas/MetricCode'
    MetricCodes100Optional:
      name: metric
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 100
        uniqueItems: true
        items:
          $ref: '#/components/schemas/MetricCode'
    MethodologyCode:
      name: methodologyCode
      in: query
      required: true
      description: Selects exactly one approved methodology; never an implicit active default.
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_.-]{2,79}$'
    MethodologyVersion:
      name: methodologyVersion
      in: query
      required: true
      description: Selects one immutable methodology version and its publication.
      schema:
        type: integer
        minimum: 1
    ValuationMetrics:
      name: metric
      in: query
      required: true
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 5
        uniqueItems: true
        items:
          $ref: '#/components/schemas/ValuationMetricCode'
    ReportPeriodFrom:
      name: reportPeriodFrom
      in: query
      required: false
      schema:
        type: string
        format: date
    ReportPeriodTo:
      name: reportPeriodTo
      in: query
      required: false
      schema:
        type: string
        format: date
    StartDate:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date
    AsOf:
      name: asOf
      in: query
      required: false
      description: |
        Inclusive market-effective date in Asia/Shanghai. Defaults to the
        publication effective cutoff and is independent from reportPeriod.
      schema:
        type: string
        format: date
    KnownAt:
      name: knownAt
      in: query
      required: false
      description: |
        Inclusive platform-knowledge instant. Defaults to the selected
        publication knowledge cutoff. Future instants are rejected.
      schema:
        type: string
        format: date-time
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 1024
      description: Opaque cursor bound to filters, time cutoffs, and dataVersion.
    Limit50:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Limit200:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    Limit500:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 200
    Limit1000:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 500
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    ETag:
      description: Strong tag derived from normalized query and dataVersion.
      schema:
        type: string
    PrivateRevalidate:
      schema:
        type: string
        const: private, max-age=0, must-revalidate
    DataVersion:
      description: Stable UUID of the selected immutable publication.
      schema:
        type: string
        format: uuid

  responses:
    ValidationProblem:
      description: Path, filter, date range, metric selection, or time cutoff is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Access token is missing, expired, invalid, or securityVersion is stale.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks financial-data read permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Requested published instrument, report, metric, or methodology does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CursorMismatch:
      description: Cursor does not match filters or its dataVersion is no longer selectable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Authenticated actor exceeded the financial-data read budget.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DataSyncUnavailable:
      description: |
        service-data-sync is unavailable or no production-approved publication
        satisfies the request. service-api returns no unmarked stale result.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Exchange:
      type: string
      enum: [SSE, SZSE, BSE]
    Symbol:
      type: string
      pattern: '^[0-9]{6}$'
    StatementType:
      type: string
      enum: [BALANCE_SHEET, INCOME_STATEMENT, CASH_FLOW_STATEMENT]
    PeriodBasis:
      type: string
      enum: [POINT_IN_TIME, YEAR_TO_DATE, SINGLE_QUARTER, TTM]
    StatementScope:
      type: string
      enum: [CONSOLIDATED, PARENT, UNKNOWN]
    MetricOrigin:
      type: string
      enum: [PROVIDER_REPORTED, PLATFORM_DERIVED]
    KnowledgeBasis:
      type: string
      enum: [OFFICIAL_ANNOUNCEMENT, PROVIDER_UPDATE, OBSERVED_AT]
    KnowledgeConfidence:
      type: string
      enum: [HIGH, MEDIUM, CONSERVATIVE]
    AuditStatus:
      type: string
      enum: [AUDITED, UNAUDITED, UNKNOWN]
    QualityStatus:
      type: string
      enum: [PASSED, WARNED]
    ValuationMetricCode:
      type: string
      enum: [market_cap, pe_ttm, pe_static, pb, pcf]
    MetricCode:
      type: string
      pattern: '^[a-z][a-z0-9_.-]{1,79}$'
    DecimalString:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
      description: Exact decimal serialized as a string; never a JSON floating-point number.
    NullableDecimalString:
      oneOf:
        - $ref: '#/components/schemas/DecimalString'
        - type: 'null'
    PositiveDecimalString:
      type: string
      pattern: '^[0-9]+(\.[0-9]+)?$'
    FactNullReason:
      type: string
      enum: [NOT_REPORTED, NOT_APPLICABLE, UPSTREAM_NULL]
    NullableFactNullReason:
      oneOf:
        - $ref: '#/components/schemas/FactNullReason'
        - type: 'null'
    CurrencyNullReason:
      type: string
      enum: [NOT_APPLICABLE, UNKNOWN_SOURCE, MIXED_CURRENCIES]
    NullableCurrencyNullReason:
      oneOf:
        - $ref: '#/components/schemas/CurrencyNullReason'
        - type: 'null'
    NullableDate:
      type: [string, 'null']
      format: date
    NullableDateTime:
      type: [string, 'null']
      format: date-time

    FinancialReportHeader:
      type: object
      additionalProperties: false
      required:
        - reportRef
        - exchange
        - symbol
        - statementType
        - reportPeriod
        - periodBasis
        - statementScope
        - currency
        - currencyNullReason
        - reportType
        - auditStatus
        - announcementDate
        - providerUpdateDate
        - availableFrom
        - knowledgeBasis
        - knowledgeConfidence
        - revision
        - methodologyCode
        - methodologyVersion
        - qualityStatus
      properties:
        reportRef:
          type: string
          format: uuid
        exchange:
          $ref: '#/components/schemas/Exchange'
        symbol:
          $ref: '#/components/schemas/Symbol'
        statementType:
          $ref: '#/components/schemas/StatementType'
        reportPeriod:
          type: string
          format: date
        periodBasis:
          $ref: '#/components/schemas/PeriodBasis'
        statementScope:
          $ref: '#/components/schemas/StatementScope'
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
          description: ISO 4217 reporting currency when known; null is never encoded as a synthetic code.
        currencyNullReason:
          $ref: '#/components/schemas/NullableCurrencyNullReason'
          description: |
            Exactly one of currency and currencyNullReason is non-null. Header
            null commonly means unknown or mixed currencies, never zero value.
        reportType:
          type: string
          minLength: 1
          maxLength: 64
        auditStatus:
          $ref: '#/components/schemas/AuditStatus'
        announcementDate:
          $ref: '#/components/schemas/NullableDate'
        providerUpdateDate:
          $ref: '#/components/schemas/NullableDateTime'
        availableFrom:
          type: string
          format: date
          description: Conservative earliest business-effective date for this revision.
        knowledgeBasis:
          $ref: '#/components/schemas/KnowledgeBasis'
        knowledgeConfidence:
          $ref: '#/components/schemas/KnowledgeConfidence'
        revision:
          type: integer
          minimum: 1
        methodologyCode:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{2,79}$'
        methodologyVersion:
          type: integer
          minimum: 1
        qualityStatus:
          $ref: '#/components/schemas/QualityStatus'

    FinancialStatementItem:
      type: object
      additionalProperties: false
      required:
        - metricCode
        - label
        - value
        - nullReason
        - currency
        - currencyNullReason
        - unit
      properties:
        metricCode:
          $ref: '#/components/schemas/MetricCode'
        label:
          type: string
          minLength: 1
          maxLength: 160
        value:
          $ref: '#/components/schemas/NullableDecimalString'
          description: Exactly one of value and nullReason is non-null.
        nullReason:
          $ref: '#/components/schemas/NullableFactNullReason'
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        currencyNullReason:
          $ref: '#/components/schemas/NullableCurrencyNullReason'
          description: |
            Exactly one of currency and currencyNullReason is non-null.
            Non-monetary metrics use NOT_APPLICABLE; unknown source currency is explicit.
        unit:
          type: string
          minLength: 1
          maxLength: 32

    FinancialReportPage:
      type: object
      additionalProperties: false
      required:
        - exchange
        - symbol
        - items
        - nextCursor
        - methodologyCode
        - methodologyVersion
        - dataVersion
        - publishedAt
        - effectiveAsOf
        - knowledgeCutoff
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        symbol:
          $ref: '#/components/schemas/Symbol'
        methodologyCode:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{2,79}$'
        methodologyVersion:
          type: integer
          minimum: 1
        items:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/FinancialReportHeader'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        effectiveAsOf:
          type: string
          format: date
        knowledgeCutoff:
          type: string
          format: date-time

    FinancialReportDetail:
      type: object
      additionalProperties: false
      required:
        - report
        - items
        - nextCursor
        - dataVersion
        - publishedAt
        - effectiveAsOf
        - knowledgeCutoff
      properties:
        report:
          $ref: '#/components/schemas/FinancialReportHeader'
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/FinancialStatementItem'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        effectiveAsOf:
          type: string
          format: date
        knowledgeCutoff:
          type: string
          format: date-time

    FinancialMetric:
      type: object
      additionalProperties: false
      allOf:
        - if:
            properties:
              origin:
                const: PLATFORM_DERIVED
          then:
            properties:
              formulaVersion:
                type: integer
                minimum: 1
          else:
            properties:
              formulaVersion:
                type: 'null'
      required:
        - metricCode
        - label
        - origin
        - reportPeriod
        - periodBasis
        - statementScope
        - value
        - unit
        - currency
