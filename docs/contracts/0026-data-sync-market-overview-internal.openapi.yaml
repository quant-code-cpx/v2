openapi: 3.1.0
info:
  title: quant-v2 市场概览与行业板块内部读取 API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  x-contract-status: Accepted
  description: >-
    service-api 读取 service-data-sync 已发布市场事实的内部资源合同。十条路由只使用
    GET，200 与 304 均绑定同一强 ETag、X-Data-Version 和 X-Request-Id。响应来自
    完整且不可变的 publication；不从板块 EOD 推导全市场宽度，不从指数成分观察
    伪造指数行情，也不把供应商资金流语义改写为统一市场事实。
servers:
  - url: /
security:
  - serviceBearer: []
paths:
  /internal/v1/market/overview-bundles/{snapshot}:
    get:
      operationId: getInternalMarketOverviewBundle
      summary: 读取 latest 或精确历史市场完整包
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/Snapshot"
      responses:
        "200":
          $ref: "#/components/responses/MarketOverview"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/indices/{index_id}/bars:
    get:
      operationId: listInternalMarketIndexBars
      summary: 读取主要指数日 K 线
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/IndexId"
        - name: period
          in: query
          required: false
          schema:
            const: 1d
            default: 1d
        - name: start
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DateOnly"
        - name: end
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DateOnly"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          $ref: "#/components/responses/MarketIndexBars"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/equity-rankings:
    get:
      operationId: listInternalMarketEquityRankings
      summary: 读取冻结全市场股票横截面排行
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: metric
          in: query
          required: true
          schema:
            enum: [changePercent, amountCny, turnoverPercent]
        - name: order
          in: query
          required: true
          schema:
            enum: [asc, desc]
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          $ref: "#/components/responses/MarketEquityRankings"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/money-flow/equity-rankings:
    get:
      operationId: listInternalMarketEquityMoneyFlowRankings
      summary: 读取订单规模口径股票资金流排行
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: direction
          in: query
          required: true
          schema:
            enum: [inflow, outflow]
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          $ref: "#/components/responses/MarketEquityMoneyFlowRankings"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/calendar:
    get:
      operationId: listInternalMarketCalendar
      summary: 读取沪深交易日历与会话日程
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: venues
          in: query
          required: true
          description: 由逗号连接且不重复的 SSE、SZSE 场所列表。
          schema:
            type: string
            minLength: 3
            maxLength: 16
            pattern: "^(?:SSE|SZSE)(?:,(?:SSE|SZSE))?$"
        - name: start
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DateOnly"
        - name: end
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/DateOnly"
      responses:
        "200":
          $ref: "#/components/responses/MarketCalendar"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/sectors/strength:
    get:
      operationId: listInternalMarketSectorStrength
      summary: 读取东财板块强弱与持续性排行
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/Scheme"
        - name: window
          in: query
          required: true
          schema:
            type: integer
            enum: [1, 5, 20]
        - name: order
          in: query
          required: true
          schema:
            enum: [asc, desc]
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          $ref: "#/components/responses/MarketSectorStrength"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/sectors/money-flow-rankings:
    get:
      operationId: listInternalMarketSectorMoneyFlowRankings
      summary: 读取东财来源板块资金流排行
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/Scheme"
        - name: order
          in: query
          required: true
          schema:
            enum: [asc, desc]
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          $ref: "#/components/responses/MarketSectorMoneyFlowRankings"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/industries/sw/{code}/bars:
    get:
      operationId: listInternalSwIndustryBars
      summary: 读取申万行业已物化日周月 K 线
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/SwIndustryCode"
        - name: period
          in: query
          required: false
          schema:
            enum: [1d, 1w, 1mo]
            default: 1d
        - name: start
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DateOnly"
        - name: end
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DateOnly"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 500
      responses:
        "200":
          $ref: "#/components/responses/SwIndustryBars"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/industries/sw/{code}/constituents:
    get:
      operationId: listInternalSwIndustryConstituents
      summary: 读取申万行业正式成分页
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/SwIndustryCode"
        - $ref: "#/components/parameters/AsOf"
        - $ref: "#/components/parameters/Cursor"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
      responses:
        "200":
          $ref: "#/components/responses/SwIndustryConstituents"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /internal/v1/market/industries/sw/{code}/valuation:
    get:
      operationId: getInternalSwIndustryValuation
      summary: 读取申万行业逐字段估值
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/SwIndustryCode"
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          $ref: "#/components/responses/SwIndustryValuation"
        "304":
          $ref: "#/components/responses/NotModified"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "424":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    serviceBearer:
      type: http
      scheme: bearer
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        minLength: 3
        maxLength: 254
        pattern: '^"[^"\r\n]{1,252}"$'
    Snapshot:
      name: snapshot
      in: path
      required: true
      schema:
        oneOf:
          - const: latest
          - $ref: "#/components/schemas/DateOnly"
    IndexId:
      name: index_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/MarketIndexId"
    SwIndustryCode:
      name: code
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/SwIndustryCode"
    AsOf:
      name: asOf
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/DateOnly"
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    Scheme:
      name: scheme
      in: query
      required: true
      schema:
        $ref: "#/components/schemas/MarketScheme"
  headers:
    RequestId:
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$"
    DataVersion:
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    EntityTag:
      required: true
      schema:
        type: string
        minLength: 3
        maxLength: 254
        pattern: '^"[^"\r\n]{1,252}"$'
    SuccessCacheControl:
      required: true
      schema:
        const: "private, max-age=0, must-revalidate"
    ProblemCacheControl:
      required: true
      schema:
        const: no-store
    RetryAfter:
      schema:
        type: integer
        minimum: 1
  responses:
    MarketOverview:
      $ref: "#/components/responses/MarketOverviewResponse"
    MarketIndexBars:
      $ref: "#/components/responses/MarketIndexBarsResponse"
    MarketEquityRankings:
      $ref: "#/components/responses/MarketEquityRankingsResponse"
    MarketEquityMoneyFlowRankings:
      $ref: "#/components/responses/MarketEquityMoneyFlowRankingsResponse"
    MarketCalendar:
      $ref: "#/components/responses/MarketCalendarResponse"
    MarketSectorStrength:
      $ref: "#/components/responses/MarketSectorStrengthResponse"
    MarketSectorMoneyFlowRankings:
      $ref: "#/components/responses/MarketSectorMoneyFlowRankingsResponse"
    SwIndustryBars:
      $ref: "#/components/responses/SwIndustryBarsResponse"
    SwIndustryConstituents:
      $ref: "#/components/responses/SwIndustryConstituentsResponse"
    SwIndustryValuation:
      $ref: "#/components/responses/SwIndustryValuationResponse"
    MarketOverviewResponse:
      description: 市场首页原子完整包
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketOverview"
    MarketIndexBarsResponse:
      description: 主要指数日 K 线 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketIndexBarPage"
    MarketEquityRankingsResponse:
      description: 全市场股票横截面排行 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketEquityRankingPage"
    MarketEquityMoneyFlowRankingsResponse:
      description: 订单规模方法学股票资金流排行 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketEquityMoneyFlowRankingPage"
    MarketCalendarResponse:
      description: 沪深交易日历 publication
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketCalendarPage"
    MarketSectorStrengthResponse:
      description: 板块强弱完整窗口 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketSectorStrengthPage"
    MarketSectorMoneyFlowRankingsResponse:
      description: 东财来源板块资金流 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MarketSectorMoneyFlowRankingPage"
    SwIndustryBarsResponse:
      description: 申万行业已物化 K 线 publication 页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryBarPage"
    SwIndustryConstituentsResponse:
      description: 申万行业正式成分页
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryConstituentPage"
    SwIndustryValuationResponse:
      description: 申万行业逐字段估值 publication
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SwIndustryValuation"
    NotModified:
      description: If-None-Match 命中；响应体为空。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        X-Data-Version:
          $ref: "#/components/headers/DataVersion"
        ETag:
          $ref: "#/components/headers/EntityTag"
        Cache-Control:
          $ref: "#/components/headers/SuccessCacheControl"
    Problem:
      description: 内部市场读取稳定问题响应
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/ProblemCacheControl"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Uuid:
      type: string
      format: uuid
    DateOnly:
      type: string
      format: date
      pattern: '^\d{4}-\d{2}-\d{2}$'
    OffsetDateTime:
      type: string
      format: date-time
    DecimalString:
      type: string
      pattern: '^-?(?:0|[1-9]\d*)(?:\.\d+)?$'
    UnitIntervalDecimalString:
      type: string
      pattern: '^(?:-?0(?:\.0+)?|0\.\d+|1(?:\.0+)?)$'
    MarketIndexId:
      enum: [sse-composite, szse-component, csi-300, chinext]
    SwIndustryCode:
      type: string
      pattern: '^[0-9]{6}\.SI$'
    MarketScheme:
      enum: [eastmoney.industry, eastmoney.concept]
    MarketSource:
      type: object
      additionalProperties: false
      required:
        [
          provider,
          upstreamSource,
          sourceDataset,
          observedAt,
          adapterVersion,
          schemaFingerprint,
        ]
      properties:
        provider:
          const: tushare-pro
        upstreamSource:
          type: string
          minLength: 1
          maxLength: 128
        sourceDataset:
          type: string
          minLength: 1
          maxLength: 128
        observedAt:
          $ref: "#/components/schemas/OffsetDateTime"
        adapterVersion:
          type: string
          minLength: 1
          maxLength: 64
        schemaFingerprint:
          type: string
          pattern: "^[a-f0-9]{64}$"
    QualityCheck:
      type: object
      additionalProperties: false
      required: [code, status, actual, expected]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 128
        status:
          const: passed
        actual:
          type: string
          maxLength: 256
        expected:
          type: string
          maxLength: 256
    EquityRankItem:
      type: object
      additionalProperties: false
      required:
        [
          exchange,
          symbol,
          name,
          rank,
          close,
          changePercent,
          amountCny,
          turnoverPercent,
        ]
      properties:
        exchange:
          enum: [SSE, SZSE]
        symbol:
          type: string
          pattern: "^[0-9]{6}$"
        name:
          type: string
          minLength: 1
          maxLength: 128
        rank:
          type: integer
          minimum: 1
        close:
          $ref: "#/components/schemas/DecimalString"
        changePercent:
          $ref: "#/components/schemas/DecimalString"
        amountCny:
          $ref: "#/components/schemas/DecimalString"
        turnoverPercent:
          oneOf:
            - $ref: "#/components/schemas/DecimalString"
            - type: "null"
    MoneyFlowRankItem:
      type: object
      additionalProperties: false
      required:
        [
          exchange,
          symbol,
          name,
          rank,
          netAmountCny,
          buyLargeAmountCny,
          sellLargeAmountCny,
          changePercent,
        ]
      properties:
        exchange:
          enum: [SSE, SZSE]
        symbol:
          type: string
          pattern: "^[0-9]{6}$"
        name:
