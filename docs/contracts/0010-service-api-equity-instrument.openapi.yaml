openapi: 3.1.1
info:
  title: service-api equity instrument API
  version: 2.0.0
  description: |
    Implemented authenticated public API for published Shanghai, Shenzhen, and
    Beijing A-share instrument catalogs and listing lifecycle history.
    service-api owns authentication, authorization, request validation, abuse
    controls, and public projection. service-data-sync remains canonical owner
    and is accessed only through contract 0009.

    Public identity is exchange plus symbol. Internal instrument UUIDs, database
    keys, raw evidence, provider fields, PENDING placeholders, and quarantine
    details are never exposed. This contract is the implementation authority for
    the equity catalog, detail, and listing-status portions that overlap
    contract 0004. Bars, adjustment factors, corporate actions, and financial
    endpoints remain governed by contract 0004.

    Contract C1 is active downstream: a reused exchange and symbol is resolved
    by asOf and knownAt through service-data-sync identifier history; current
    compatibility columns never define public identity.
  x-contract-status: Implemented
  x-partially-supersedes: 0004-service-api-equity.openapi.yaml
x-http-method-policy: post-only
servers:
  - url: /api/v1
tags:
  - name: equity-instruments
security:
  - userBearer: []
paths:
  /equities:
    post:
      tags: [equity-instruments]
      operationId: listEquityInstruments
      summary: List confirmed A-share instruments at effective and knowledge time
      description: |
        Omit exchange to read only the last stable three-exchange aggregate
        publication. The API never mixes independently refreshed exchange
        snapshots. Cursor, filters, asOf, knownAt, and dataVersion form one
        immutable read snapshot.
      parameters:
        - $ref: '#/components/parameters/ExchangeQuery'
        - $ref: '#/components/parameters/ListingStatuses'
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize100'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Page ordered by exchange and symbol.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquityPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SnapshotExpired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /equities/{exchange}/{symbol}:
    post:
      tags: [equity-instruments]
      operationId: getEquityInstrument
      summary: Get one A-share instrument by public exchange and symbol identity
      description: |
        exchange and symbol resolve only against bitemporal identifier history;
        names and lifecycle states never participate in identity matching. When
        asOf is omitted, only the unique current-open identifier is eligible. A
        reused code therefore resolves to its current security; callers must
        supply asOf to address the former security. No eligible identity is 404.
        More than one eligible identity is a 409 integrity conflict and is never
        resolved by arbitrary ordering. No internal identity or provenance is
        included in the public projection.
      parameters:
        - $ref: '#/components/parameters/ExchangePath'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: One published bitemporal instrument projection.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquityDetail'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/IdentityResolutionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /equities/{exchange}/{symbol}/listing-status-history:
    post:
      tags: [equity-instruments]
      operationId: listEquityListingStatusHistory
      summary: List listing lifecycle periods for one A-share instrument
      description: |
        asOf resolves which security owns the path identifier; effectiveFrom and
        effectiveTo then filter that security's lifecycle periods. Omit asOf to
        select only the unique current-open identifier. A former security whose
        code was reused requires asOf. Lifecycle includes listed,
        exchange-confirmed listing suspension, and delisted states. Ordinary
        trading suspension is a different dataset and is not returned here.
      parameters:
        - $ref: '#/components/parameters/ExchangePath'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/AsOf'
        - $ref: '#/components/parameters/EffectiveFrom'
        - $ref: '#/components/parameters/EffectiveTo'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize100'
        - $ref: '#/components/parameters/IfNoneMatch'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Listing-status history page from one dataVersion.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
            X-Data-Version:
              $ref: '#/components/headers/DataVersion'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingStatusHistoryPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HistoryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Existing authenticated service-api session. Proposed initial policy
        allows active USER, ADMIN, and SUPER_ADMIN roles to read; final
        fine-grained permission remains an authorization review gate.

  parameters:
    ExchangeQuery:
      name: exchange
      in: query
      required: false
      description: Omit to use the last stable three-exchange aggregate publication.
      schema:
        $ref: '#/components/schemas/Exchange'
    ExchangePath:
      name: exchange
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Exchange'
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Symbol'
    ListingStatuses:
      name: status
      in: query
      required: false
      style: form
      explode: true
      schema:
        type: array
        minItems: 1
        maxItems: 3
        uniqueItems: true
        items:
          $ref: '#/components/schemas/ListingStatus'
    Query:
      name: query
      in: query
      required: false
      description: Prefix match over symbol or name valid in the selected time slice.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AsOf:
      name: asOf
      in: query
      required: false
      description: |
        Market effective date in Asia/Shanghai. On collection reads it defaults
        to the effective date represented by the selected publication. On keyed
        detail or history reads, omission accepts only the unique current-open
        identifier; resolving a former security after code reuse requires asOf.
      schema:
        type: string
        format: date
    KnownAt:
      name: knownAt
      in: query
      required: false
      description: |
        Inclusive system-knowledge instant. Defaults to the publication knowledge
        cutoff. Future instants are rejected.
      schema:
        type: string
        format: date-time
    EffectiveFrom:
      name: effectiveFrom
      in: query
      required: false
      description: Inclusive lower effective-date bound.
      schema:
        type: string
        format: date
    EffectiveTo:
      name: effectiveTo
      in: query
      required: false
      description: Exclusive upper effective-date bound; must follow effectiveFrom.
      schema:
        type: string
        format: date
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque authenticated cursor bound to filters, sort keys, and dataVersion.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    PageSize100:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128

  headers:
    ETag:
      description: Strong tag derived from normalized request projection and dataVersion.
      schema:
        type: string
    PrivateRevalidate:
      schema:
        type: string
        const: private, max-age=0, must-revalidate
    DataVersion:
      description: Stable UUID of the selected exchange or aggregate publication.
      schema:
        type: string
        format: uuid

  responses:
    ValidationProblem:
      description: |
        Path syntax, query syntax, time range, or cursor is malformed or
        unsupported. Identity absence and identity ambiguity are not validation
        failures; they use 404 and 409 respectively.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Access token is missing, expired, revoked, or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks the final market-data read permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        No published identity exists in the selected time slice. Without asOf,
        only a unique current-open identifier is considered; a historical-only
        identifier therefore returns 404.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    IdentityResolutionConflict:
      description: |
        More than one published security matched the identifier and time slice.
        This is a downstream canonical-history conflict; service-api does not
        choose by name, lifecycle state, or ordering and exposes no internal IDs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            ambiguousIdentity:
              value:
                type: /problems/identity-resolution-conflict
                title: Instrument identity is ambiguous
                status: 409
                code: identity-resolution-conflict
                detail: The identifier cannot be resolved uniquely for the requested time slice
                requestId: req-example
    HistoryConflict:
      description: |
        Either identifier history is ambiguous for the selected time slice, or
        the cursor refers to a superseded dataVersion. Restart pagination only
        for a snapshot-expired problem code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    SnapshotExpired:
      description: Cursor refers to a superseded dataVersion; restart from the first page.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Authenticated actor exceeded the equity-master read budget.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DataSyncUnavailable:
      description: |
        Canonical downstream is unavailable or has no stable aggregate
        publication. The API does not return mixed or unmarked stale data.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Exchange:
      type: string
      enum: [SSE, SZSE, BSE]
    Symbol:
      type: string
      pattern: '^[0-9]{6}$'
    ListingStatus:
      type: string
      enum: [LISTED, SUSPENDED, DELISTED]
      description: |
        Listing lifecycle only. SUSPENDED means explicit exchange-level listing
        suspension. PENDING identities and ordinary trading suspensions are not
        public lifecycle states.
    EffectiveDatePrecision:
      type: string
      enum: [OFFICIAL_DATE, OBSERVATION_DATE]
    NullableDate:
      type: [string, 'null']
      format: date
    NullableDateTime:
      type: [string, 'null']
      format: date-time

    TemporalIdentifier:
      type: object
      additionalProperties: false
      required:
        - exchange
        - symbol
        - effectiveFrom
        - effectiveTo
        - datePrecision
        - knownFrom
        - observedAt
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        symbol:
          $ref: '#/components/schemas/Symbol'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          $ref: '#/components/schemas/NullableDate'
        datePrecision:
          $ref: '#/components/schemas/EffectiveDatePrecision'
        knownFrom:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time

    TemporalName:
      type: object
      additionalProperties: false
      required:
        - value
        - effectiveFrom
        - effectiveTo
        - datePrecision
        - knownFrom
        - observedAt
      properties:
        value:
          type: string
          minLength: 1
          maxLength: 200
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          $ref: '#/components/schemas/NullableDate'
        datePrecision:
          $ref: '#/components/schemas/EffectiveDatePrecision'
        knownFrom:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time

    TemporalListing:
      type: object
      additionalProperties: false
      required:
        - status
        - listedOn
        - delistedOn
        - effectiveFrom
        - effectiveTo
        - datePrecision
        - knownFrom
        - observedAt
      properties:
        status:
          $ref: '#/components/schemas/ListingStatus'
        listedOn:
          $ref: '#/components/schemas/NullableDate'
        delistedOn:
          $ref: '#/components/schemas/NullableDate'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          $ref: '#/components/schemas/NullableDate'
        datePrecision:
          $ref: '#/components/schemas/EffectiveDatePrecision'
        knownFrom:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time

    EquityItem:
      type: object
      additionalProperties: false
      required: [identifier, name, listing]
      properties:
        identifier:
          $ref: '#/components/schemas/TemporalIdentifier'
        name:
          $ref: '#/components/schemas/TemporalName'
        listing:
          $ref: '#/components/schemas/TemporalListing'

    EquityPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - dataVersion
        - publishedAt
        - effectiveAsOf
        - knowledgeCutoff
        - publicationScope
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EquityItem'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        effectiveAsOf:
          type: string
          format: date
        knowledgeCutoff:
          type: string
          format: date-time
        publicationScope:
          type: string
          enum: [SSE, SZSE, BSE, CN_A_STABLE]

    EquityDetail:
      type: object
      additionalProperties: false
      required:
        - identifier
        - name
        - listing
        - dataVersion
        - publishedAt
        - effectiveAsOf
        - knowledgeCutoff
      properties:
        identifier:
          $ref: '#/components/schemas/TemporalIdentifier'
        name:
          $ref: '#/components/schemas/TemporalName'
        listing:
          $ref: '#/components/schemas/TemporalListing'
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        effectiveAsOf:
          type: string
          format: date
        knowledgeCutoff:
          type: string
          format: date-time

    ListingStatusPeriod:
      type: object
      additionalProperties: false
      required:
        - status
        - effectiveFrom
        - effectiveTo
        - effectiveDatePrecision
        - knownFrom
        - knownTo
        - observedAt
      properties:
        status:
          $ref: '#/components/schemas/ListingStatus'
        effectiveFrom:
          type: string
          format: date
        effectiveTo:
          $ref: '#/components/schemas/NullableDate'
        effectiveDatePrecision:
          $ref: '#/components/schemas/EffectiveDatePrecision'
        knownFrom:
          type: string
          format: date-time
        knownTo:
          $ref: '#/components/schemas/NullableDateTime'
        observedAt:
          type: string
          format: date-time

    ListingStatusHistoryPage:
      type: object
      additionalProperties: false
      required:
        - exchange
        - symbol
        - items
        - nextCursor
        - dataVersion
        - publishedAt
        - knowledgeCutoff
      properties:
        exchange:
          $ref: '#/components/schemas/Exchange'
        symbol:
          $ref: '#/components/schemas/Symbol'
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ListingStatusPeriod'
        nextCursor:
          type: [string, 'null']
          maxLength: 1024
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        knowledgeCutoff:
          type: string
          format: date-time

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[a-z][a-z0-9-]{1,63}$'
        detail:
          type: string
          maxLength: 500
        requestId:
          type: string
          maxLength: 128
