openapi: 3.1.1
info:
  title: service-api daily money-flow API
  version: 2.0.0
  description: |
    Implemented authenticated projection of published vendor-derived daily
    money-flow series and supplier ranking snapshots. Methodology discovery is
    mandatory. The API exposes no ambiguous generic money-flow value and never
    combines providers, methodologies, daily observations, or rolling windows.
  x-contract-status: Implemented
x-http-method-policy: post-only
servers:
  - url: /api/v1
tags:
  - name: market-money-flow-methodologies
  - name: market-money-flow-daily-series
  - name: market-money-flow-supplier-rankings
security:
  - userBearer: []
paths:
  /market/money-flow/methodologies:
    post:
      tags: [market-money-flow-methodologies]
      operationId: listMoneyFlowMethodologies
      summary: Discover published money-flow methodologies
      description: |
        Returns only API-eligible methodology versions. If no source has passed
        the technical publication gates, no public publication exists and the
        route returns 503 rather than exposing research candidates.
      parameters:
        - $ref: '#/components/parameters/SemanticFamily'
        - $ref: '#/components/parameters/MethodologyStatus'
        - $ref: '#/components/parameters/ScopeTypeFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/CatalogLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: One methodology catalog page from one publication.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MethodologyPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/QueryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /market/money-flow/methodologies/{methodologyId}/daily-series/equities/{exchange}/{symbol}:
    post:
      tags: [market-money-flow-daily-series]
      operationId: listEquityDailyMoneyFlow
      summary: Read one explicit equity daily series
      description: |
        Reads source-reported daily observations only. A historical code is
        resolved for each tradeDate, so code reuse cannot leak another security.
        Maximum requested calendar span is 366 days.
      parameters:
        - $ref: '#/components/parameters/MethodologyId'
        - $ref: '#/components/parameters/Exchange'
        - $ref: '#/components/parameters/Symbol'
        - $ref: '#/components/parameters/MethodologyVersion'
        - $ref: '#/components/parameters/Bucket'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SeriesLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/EquityDailySeries'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/QueryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /market/money-flow/methodologies/{methodologyId}/daily-series/sectors/{scheme}/{sectorCode}:
    post:
      tags: [market-money-flow-daily-series]
      operationId: listSectorDailyMoneyFlow
      summary: Read one explicit sector daily series
      description: |
        Reads an upstream sector series. It never aggregates constituent equity
        values and never substitutes another scheme. Maximum span is 366 days.
      parameters:
        - $ref: '#/components/parameters/MethodologyId'
        - $ref: '#/components/parameters/SectorScheme'
        - $ref: '#/components/parameters/SectorCode'
        - $ref: '#/components/parameters/MethodologyVersion'
        - $ref: '#/components/parameters/Bucket'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SeriesLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/SectorDailySeries'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/QueryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /market/money-flow/methodologies/{methodologyId}/daily-series/markets/{marketCode}:
    post:
      tags: [market-money-flow-daily-series]
      operationId: listMarketDailyMoneyFlow
      summary: Read one explicit market daily series
      description: |
        Reads the source-reported market scope, not a sum of equity or sector
        values. Maximum requested calendar span is 366 days.
      parameters:
        - $ref: '#/components/parameters/MethodologyId'
        - $ref: '#/components/parameters/MarketCode'
        - $ref: '#/components/parameters/MethodologyVersion'
        - $ref: '#/components/parameters/Bucket'
        - $ref: '#/components/parameters/Start'
        - $ref: '#/components/parameters/End'
        - $ref: '#/components/parameters/KnownAt'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/SeriesLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          $ref: '#/components/responses/MarketDailySeries'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/QueryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

  /market/money-flow/methodologies/{methodologyId}/supplier-rankings:
    post:
      tags: [market-money-flow-supplier-rankings]
      operationId: listSupplierMoneyFlowRanking
      summary: Read one supplier ranking snapshot
      description: |
        Requires methodology version, universe, scope type, supplier window, and
        bucket. Omit tradeDate for latest or provide an exact published date.
        supplierPosition is preserved page order, not a platform-computed rank.
        windowSize must be 1 for supplier_day and greater than 1 for
        supplier_rolling.
      parameters:
        - $ref: '#/components/parameters/MethodologyId'
        - $ref: '#/components/parameters/MethodologyVersion'
        - $ref: '#/components/parameters/RankingScopeType'
        - $ref: '#/components/parameters/UniverseId'
        - $ref: '#/components/parameters/WindowType'
        - $ref: '#/components/parameters/WindowSize'
        - $ref: '#/components/parameters/Bucket'
        - $ref: '#/components/parameters/TradeDate'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RankingLimit'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: One page of an immutable supplier ranking snapshot.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/PrivateRevalidate'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RankingPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/QueryConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DataSyncUnavailable'

components:
  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Valid access token for an ACTIVE authenticated role.
  parameters:
    MethodologyId:
      name: methodologyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/MethodologyId'
    MethodologyVersion:
      name: methodologyVersion
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      description: Exact immutable version; latest is not accepted.
    SemanticFamily:
      name: semanticFamily
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SemanticFamily'
    MethodologyStatus:
      name: methodologyStatus
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/MethodologyStatus'
    ScopeTypeFilter:
      name: scopeType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ScopeType'
    Exchange:
      name: exchange
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Exchange'
    Symbol:
      name: symbol
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{6}$'
    SectorScheme:
      name: scheme
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    SectorCode:
      name: sectorCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
    MarketCode:
      name: marketCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 32
    Bucket:
      name: bucket
      in: query
      required: true
      schema:
        type: string
        pattern: '^[a-z][a-z0-9_-]{0,63}$'
      description: Governed bucket code from the selected methodology version.
    Start:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date
    End:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date
      description: Inclusive end; span must not exceed 366 days.
    KnownAt:
      name: knownAt
      in: query
      required: false
      schema:
        type: string
        format: date-time
      description: |
        UTC knowledge cutoff for point-in-time reads. Omit for current revisions.
        A later backfill is not visible before its actual knownFrom instant.
    RankingScopeType:
      name: scopeType
      in: query
      required: true
      schema:
        type: string
        enum: [equity, sector]
    UniverseId:
      name: universe
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    WindowType:
      name: windowType
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/RankingWindowType'
    WindowSize:
      name: windowSize
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 252
    TradeDate:
      name: tradeDate
      in: query
      required: false
      schema:
        type: string
        format: date
      description: Exact published snapshot date; omit for latest.
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 2048
      description: Opaque cursor bound to all filters and dataVersion.
    CatalogLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SeriesLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 250
    RankingLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 256
  headers:
    ETag:
      schema:
        type: string
      description: Strong tag derived from dataVersion and normalized projection.
    PrivateRevalidate:
      schema:
        type: string
        example: private, max-age=0, must-revalidate
  responses:
    EquityDailySeries:
      description: Published daily equity observations from one explicit series.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/PrivateRevalidate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EquityDailySeriesPage'
    SectorDailySeries:
      description: Published daily sector observations from one explicit series.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/PrivateRevalidate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SectorDailySeriesPage'
    MarketDailySeries:
      description: Published daily market observations from one explicit series.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/PrivateRevalidate'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MarketDailySeriesPage'
    ValidationProblem:
      description: Path, range, methodology, bucket, window, or cursor is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing, invalid, expired, or revoked access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor is not ACTIVE or lacks market-data permission.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Exact methodology, scope, series, bucket, or snapshot is not published.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    QueryConflict:
      description: |
        Cursor query identity or dataVersion no longer matches, or an equity
        date range crosses a historical canonical-security identity boundary.
        Restart at page one or split the request at the returned boundary.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Authenticated caller exceeded the market-data read budget.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DataSyncUnavailable:
      description: |
        Downstream canonical read is unavailable or no approved publication
        exists. service-api returns no research candidate, mixed methodology, or
        unmarked stale data.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    MethodologyId:
      type: string
      pattern: '^[a-z][a-z0-9.-]{2,99}$'
    SemanticFamily:
      type: string
      enum: [trade_direction_flow, order_size_flow]
    MethodologyStatus:
      type: string
      enum: [validated, retired]
    ScopeType:
      type: string
      enum: [equity, sector, market]
    Exchange:
      type: string
      enum: [SSE, SZSE, BSE]
    RankingWindowType:
      type: string
      enum: [supplier_day, supplier_rolling]
    Finality:
      type: string
      enum: [source_reported_daily, post_close_observation, unknown]
    QualityStatus:
      type: string
      enum: [passed, warned]
    DefinitionStatus:
      type: string
      enum: [documented, unknown]
    SupportedMeasure:
      type: string
      enum: [gross_inflow, gross_outflow, net_amount, net_ratio]
    DecimalString:
      type: string
      pattern: '^-?[0-9]+(\.[0-9]+)?$'
    NullableDecimalString:
      oneOf:
        - $ref: '#/components/schemas/DecimalString'
        - type: 'null'
    NullableDateTime:
      oneOf:
        - type: string
          format: date-time
        - type: 'null'
    WindowDefinition:
      type: object
      required: [windowType, windowSize, label]
      additionalProperties: false
      properties:
        windowType:
          type: string
          enum: [daily_source, supplier_day, supplier_rolling]
        windowSize:
          type: integer
          minimum: 1
          maximum: 252
        label:
          type: string
          minLength: 1
          maxLength: 100
    BucketDefinition:
      type: object
      required:
        - bucket
        - label
        - definitionStatus
        - thresholdMin
        - thresholdMax
        - thresholdUnit
      additionalProperties: false
      properties:
        bucket:
          type: string
          pattern: '^[a-z][a-z0-9_-]{0,63}$'
        label:
          type: string
          minLength: 1
          maxLength: 100
        definitionStatus:
          $ref: '#/components/schemas/DefinitionStatus'
        thresholdMin:
          $ref: '#/components/schemas/NullableDecimalString'
        thresholdMax:
          $ref: '#/components/schemas/NullableDecimalString'
        thresholdUnit:
          type: [string, 'null']
          maxLength: 32
    Methodology:
      type: object
      required:
        - methodologyId
        - methodologyVersion
        - methodologyStatus
        - upstreamSource
        - sourceDataset
        - semanticFamily
        - scopeTypes
        - universeIds
        - supportedWindows
        - buckets
        - supportedMeasures
        - ratioDenominator
        - directionDefinition
        - finality
        - currency
        - rawAmountUnit
        - standardAmountUnit
        - conversionVersion
        - effectiveFrom
        - retiredAt
      additionalProperties: false
      properties:
        methodologyId:
          $ref: '#/components/schemas/MethodologyId'
        methodologyVersion:
          type: string
          minLength: 1
          maxLength: 64
        methodologyStatus:
          $ref: '#/components/schemas/MethodologyStatus'
        upstreamSource:
          type: string
          minLength: 1
          maxLength: 100
        sourceDataset:
          type: string
          minLength: 1
          maxLength: 160
        semanticFamily:
          $ref: '#/components/schemas/SemanticFamily'
        scopeTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ScopeType'
        universeIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
        supportedWindows:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WindowDefinition'
        buckets:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BucketDefinition'
        supportedMeasures:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SupportedMeasure'
          description: Unsupported measures remain null for every observation.
        ratioDenominator:
          type: string
          minLength: 1
          maxLength: 160
        directionDefinition:
          type: string
          minLength: 1
          maxLength: 300
        finality:
          $ref: '#/components/schemas/Finality'
        currency:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        rawAmountUnit:
          type: string
          minLength: 1
          maxLength: 64
        standardAmountUnit:
          type: [string, 'null']
          maxLength: 64
        conversionVersion:
          type: [string, 'null']
          maxLength: 64
        effectiveFrom:
          type: string
          format: date-time
        retiredAt:
          $ref: '#/components/schemas/NullableDateTime'
    MethodologyPage:
      type: object
      required: [dataVersion, publishedAt, items, nextCursor]
      additionalProperties: false
      properties:
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Methodology'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
    EquityScope:
      type: object
      required: [scopeType, exchange, symbol, name]
      additionalProperties: false
      properties:
        scopeType:
          type: string
          const: equity
        exchange:
          $ref: '#/components/schemas/Exchange'
        symbol:
          type: string
          pattern: '^[0-9]{6}$'
        name:
          type: [string, 'null']
          maxLength: 200
    SectorScope:
      type: object
      required: [scopeType, scheme, sectorCode, name]
      additionalProperties: false
      properties:
        scopeType:
          type: string
          const: sector
        scheme:
          type: string
          minLength: 1
          maxLength: 64
        sectorCode:
          type: string
          minLength: 1
          maxLength: 64
        name:
          type: [string, 'null']
          maxLength: 200
    MarketScope:
      type: object
      required: [scopeType, marketCode, name]
      additionalProperties: false
      properties:
        scopeType:
          type: string
          const: market
        marketCode:
          type: string
          minLength: 1
          maxLength: 32
        name:
          type: string
          minLength: 1
          maxLength: 100
    RankingScope:
      oneOf:
        - $ref: '#/components/schemas/EquityScope'
        - $ref: '#/components/schemas/SectorScope'
    DailyObservation:
      type: object
      required:
        - tradeDate
        - observedAt
        - knownFrom
        - finality
        - grossInflow
        - grossOutflow
        - netAmount
        - netRatio
        - qualityStatus
      additionalProperties: false
      properties:
        tradeDate:
          type: string
          format: date
        observedAt:
          type: string
          format: date-time
        knownFrom:
          type: string
          format: date-time
        finality:
          $ref: '#/components/schemas/Finality'
        grossInflow:
          $ref: '#/components/schemas/NullableDecimalString'
        grossOutflow:
          $ref: '#/components/schemas/NullableDecimalString'
        netAmount:
          $ref: '#/components/schemas/NullableDecimalString'
        netRatio:
          $ref: '#/components/schemas/NullableDecimalString'
        qualityStatus:
          $ref: '#/components/schemas/QualityStatus'
    EquityDailySeriesPage:
      type: object
      required:
        - methodologyId
        - methodologyVersion
        - upstreamSource
        - sourceDataset
        - semanticFamily
        - scope
        - universe
        - bucket
        - supportedMeasures
        - ratioDenominator
        - directionDefinition
        - windowType
        - windowSize
        - currency
        - amountUnit
        - knownAtApplied
        - dataVersion
        - publishedAt
        - items
        - nextCursor
      additionalProperties: false
      properties:
        methodologyId:
          $ref: '#/components/schemas/MethodologyId'
        methodologyVersion:
          type: string
        upstreamSource:
          type: string
        sourceDataset:
          type: string
        semanticFamily:
          $ref: '#/components/schemas/SemanticFamily'
        scope:
          $ref: '#/components/schemas/EquityScope'
        universe:
          type: string
        bucket:
          type: string
        supportedMeasures:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SupportedMeasure'
        ratioDenominator:
          type: string
        directionDefinition:
          type: string
        windowType:
          type: string
          const: daily_source
        windowSize:
          type: integer
          const: 1
        currency:
          type: [string, 'null']
        amountUnit:
          type: string
        knownAtApplied:
          $ref: '#/components/schemas/NullableDateTime'
        dataVersion:
          type: string
          format: uuid
        publishedAt:
          type: string
          format: date-time
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/DailyObservation'
        nextCursor:
          type: [string, 'null']
          maxLength: 2048
    SectorDailySeriesPage:
      type: object
      required:
        - methodologyId
        - methodologyVersion
        - upstreamSource
        - sourceDataset
        - semanticFamily
        - scope
        - universe
        - bucket
        - supportedMeasures
        - ratioDenominator
        - directionDefinition
        - windowType
        - windowSize
        - currency
        - amountUnit
        - knownAtApplied
        - dataVersion
        - publishedAt
        - items
        - nextCursor
      additionalProperties: false
      properties:
        methodologyId:
          $ref: '#/components/schemas/MethodologyId'
        methodologyVersion:
          type: string
        upstreamSource:
          type: string
        sourceDataset:
          type: string
        semanticFamily:
          $ref: '#/components/schemas/SemanticFamily'
        scope:
