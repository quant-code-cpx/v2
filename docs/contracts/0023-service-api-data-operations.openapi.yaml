              FAILED,
              CANCELLED,
              INTERRUPTED,
              SKIPPED,
              REJECTED,
            ]
        actor:
          $ref: "#/components/schemas/ActorDisplay"
        requestId:
          type: string
          maxLength: 128
        occurredAt:
          type: string
          format: date-time
        error:
          oneOf:
            - $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ErrorSummary"
