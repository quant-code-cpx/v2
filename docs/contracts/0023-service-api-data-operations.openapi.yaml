            targetPolicy:
              allOf:
                - $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      enum:
                        [SCHEDULED_LOCAL_DATE, LATEST_COMPLETED_TRADING_DATE]
    SchedulePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ScheduleView"
        nextCursor:
          type: [string, "null"]
    ScheduleUpsertRequest:
