          maxItems: 100
          items:
            $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/HealthEvaluationSummary"
        nextCursor:
          type: [string, "null"]
    HealthCheckSubmitRequest:
      type: object
      additionalProperties: false
      required: [targets, reason]
      properties:
        targets:
          type: array
          minItems: 1
          maxItems: 100
          description: v1 同一批次 datasetCode 必须唯一
          x-unique-by: datasetCode
          items:
            $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/HealthCheckTarget"
        reason:
          type: string
          minLength: 2
          maxLength: 500
    HealthCheckDetailView:
      type: object
      additionalProperties: false
