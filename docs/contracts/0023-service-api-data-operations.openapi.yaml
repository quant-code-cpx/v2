          reason,
        ]
      properties:
        scheduleId:
          type: [string, "null"]
          format: uuid
          description: 创建时与 expectedVersion 同为 null；更新时两者都必须非 null
        datasetCode:
          type: string
          minLength: 1
          maxLength: 160
          description: v1 每个 datasetCode 至多一个计划；创建重复值返回 409
        mode:
          $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/SyncMode"
        targetPolicy:
          $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ScheduleTargetPolicy"
        frequency:
          $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ScheduleFrequency"
        misfirePolicy:
          enum: [SKIP, RUN_ONCE]
        coalesce:
          type: boolean
        enabled:
          type: boolean
        expectedVersion:
          type: [integer, "null"]
          minimum: 1
        reason:
          type: string
          minLength: 2
          maxLength: 500
      oneOf:
        - properties:
            mode:
              enum: [FULL, INCREMENTAL]
            targetPolicy:
              allOf:
                - $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      const: NONE
        - properties:
            mode:
              const: OBSERVATION_DATE
            targetPolicy:
              allOf:
                - $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ScheduleTargetPolicy"
                - properties:
                    dateResolution:
                      enum:
                        [SCHEDULED_LOCAL_DATE, LATEST_COMPLETED_TRADING_DATE]
      allOf:
        - oneOf:
            - properties:
                scheduleId:
                  type: "null"
                expectedVersion:
                  type: "null"
            - properties:
                scheduleId:
                  type: string
                  format: uuid
                expectedVersion:
                  type: integer
                  minimum: 1
    ScheduleEnabledRequest:
      type: object
      additionalProperties: false
      required: [scheduleId, enabled, expectedVersion, reason]
      properties:
        scheduleId:
          type: string
          format: uuid
        enabled:
          type: boolean
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 2
          maxLength: 500
    ActorDisplay:
      type: object
      additionalProperties: false
      required: [actorType, systemKind, actorId, displayName, deleted]
      properties:
        actorType:
          enum: [USER, SYSTEM]
        systemKind:
          type: ["string", "null"]
          enum: [SCHEDULE, LEGACY, RECOVERY, OTHER, null]
        actorId:
          type: [string, "null"]
          format: uuid
        displayName:
          type: string
          maxLength: 120
          description: 用户删除后返回“已删除用户”
        deleted:
          type: boolean
      description: >-
        USER 的 systemKind 为 null；已删除用户可隐藏 actorId 并显示“已删除用户”。
        SYSTEM 的 actorId=null、deleted=false，并把 system:schedule/*、system:legacy、
        system:recovery 分别映射为“系统计划”“遗留任务”“系统恢复”。
      oneOf:
        - properties:
            actorType:
              const: USER
            systemKind:
              type: "null"
        - properties:
            actorType:
              const: SYSTEM
            systemKind:
              enum: [SCHEDULE, LEGACY, RECOVERY, OTHER]
            actorId:
              type: "null"
            deleted:
              const: false
    OperationSearchRequest:
      allOf:
        - $ref: "#/components/schemas/CursorPageRequest"
        - type: object
          properties:
            actorIds:
              type: array
              maxItems: 100
              items:
                type: string
                format: uuid
            actions:
              type: array
              maxItems: 20
              items:
                type: string
            deliveryStatuses:
              type: array
              maxItems: 6
              items:
                $ref: "#/components/schemas/OperationDeliveryStatus"
            operationResults:
              type: array
              maxItems: 11
              items:
                $ref: "#/components/schemas/OperationResult"
            occurredFrom:
              type: [string, "null"]
              format: date-time
            occurredTo:
              type: [string, "null"]
              format: date-time
      unevaluatedProperties: false
    OperationRecord:
      type: object
      additionalProperties: false
      required:
        [
          submissionId,
          action,
          targetSummary,
          actor,
          reason,
          deliveryStatus,
          operationResult,
          authorityResource,
          authorizedAt,
          completedAt,
          lastObservedAt,
          requestId,
          error,
        ]
      properties:
        submissionId:
          type: [string, "null"]
          format: uuid
          description: 系统计划、legacy 或恢复操作没有 API submission，返回 null
        action:
          type: string
        targetSummary:
          type: string
          maxLength: 300
        actor:
          $ref: "#/components/schemas/ActorDisplay"
        reason:
          type: string
          maxLength: 500
        deliveryStatus:
          $ref: "#/components/schemas/OperationDeliveryStatus"
          description: 系统来源操作为 NOT_APPLICABLE
        operationResult:
          $ref: "#/components/schemas/OperationResult"
        authorityResource:
          type: [object, "null"]
          additionalProperties: false
          description: 与对应 SubmissionReceipt 使用相同动作映射，用于跳转权威 command/run/health/schedule
          required: [resourceType, resourceId]
          properties:
            resourceType:
              enum: [COMMAND, RUN, HEALTH_CHECK, SCHEDULE]
            resourceId:
              type: string
              format: uuid
        authorizedAt:
          type: string
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        lastObservedAt:
          type: [string, "null"]
          format: date-time
          description: service-api 最近一次从 data-sync 权威状态完成对账的时间
        requestId:
          type: string
        error:
          oneOf:
            - $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ErrorSummary"
            - type: "null"
      allOf:
        - oneOf:
            - properties:
                submissionId:
                  type: "null"
                actor:
                  properties:
                    actorType:
                      const: SYSTEM
                deliveryStatus:
                  const: NOT_APPLICABLE
            - properties:
                submissionId:
                  type: string
                  format: uuid
                actor:
                  properties:
                    actorType:
                      const: USER
                deliveryStatus:
                  enum: [PENDING, DELIVERING, ACCEPTED, REJECTED, DEAD_LETTER]
        - oneOf:
            - properties:
                deliveryStatus:
                  enum: [PENDING, DELIVERING]
                operationResult:
                  const: UNKNOWN
                authorityResource:
                  type: "null"
                completedAt:
                  type: "null"
                lastObservedAt:
                  type: "null"
            - properties:
                deliveryStatus:
                  const: ACCEPTED
                authorityResource:
                  type: object
                lastObservedAt:
                  type: string
                  format: date-time
            - properties:
                deliveryStatus:
                  const: REJECTED
                operationResult:
                  const: REJECTED
                authorityResource:
                  type: "null"
                completedAt:
                  type: string
                  format: date-time
                lastObservedAt:
                  type: string
                  format: date-time
                error:
                  $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ErrorSummary"
            - properties:
                deliveryStatus:
                  const: DEAD_LETTER
                operationResult:
                  const: UNKNOWN
                authorityResource:
                  type: "null"
                completedAt:
                  type: string
                  format: date-time
                lastObservedAt:
                  type: "null"
                error:
                  $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ErrorSummary"
            - properties:
                deliveryStatus:
                  const: NOT_APPLICABLE
                authorityResource:
                  type: object
                lastObservedAt:
                  type: string
                  format: date-time
    OperationPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/OperationRecord"
        nextCursor:
          type: [string, "null"]
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, requestId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 500
        instance:
          type: string
          minLength: 1
          maxLength: 2048
        code:
          type: string
          maxLength: 80
        requestId:
          type: string
          maxLength: 128
