          healthCheckId,
          submissionId,
          status,
          requestedAt,
          startedAt,
          finishedAt,
          requestedBy,
          targets,
          error,
        ]
      properties:
        healthCheckId:
          type: string
          format: uuid
        submissionId:
          type: [string, "null"]
          format: uuid
        status:
          $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/HealthCheckStatus"
        requestedAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        requestedBy:
          $ref: "#/components/schemas/ActorDisplay"
        targets:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/HealthCheckTargetResult"
        error:
          oneOf:
            - $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ErrorSummary"
            - type: "null"
    ScheduleSearchRequest:
      allOf:
        - $ref: "#/components/schemas/CursorPageRequest"
        - type: object
          properties:
            datasetCodes:
              type: array
              maxItems: 100
              items:
                type: string
            enabled:
              type: [boolean, "null"]
      unevaluatedProperties: false
    ScheduleView:
      type: object
      additionalProperties: false
      required:
        [
          scheduleId,
          datasetCode,
          mode,
          targetPolicy,
          enabled,
          frequency,
          misfirePolicy,
          coalesce,
          nextRunAt,
          nextOccurrences,
          version,
          updatedAt,
          updatedBy,
        ]
      properties:
        scheduleId:
          type: string
          format: uuid
        datasetCode:
          type: string
        mode:
          $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/SyncMode"
        targetPolicy:
          $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ScheduleTargetPolicy"
        enabled:
          type: boolean
        frequency:
          $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ScheduleFrequency"
        misfirePolicy:
          enum: [SKIP, RUN_ONCE]
        coalesce:
          type: boolean
        nextRunAt:
          type: [string, "null"]
          format: date-time
        nextOccurrences:
          type: array
          maxItems: 5
          items:
            type: string
            format: date-time
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: "#/components/schemas/ActorDisplay"
      oneOf:
        - properties:
            mode:
              enum: [FULL, INCREMENTAL]
            targetPolicy:
              allOf:
                - $ref: "0022-data-sync-operations-internal.openapi.yaml#/components/schemas/ScheduleTargetPolicy"
