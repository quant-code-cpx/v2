openapi: 3.1.1
info:
  title: service-api equity public API
  version: 2.0.0-proposed
  description: |
    Proposed authenticated read contract for published A-share master, bar,
    adjustment, corporate-action and financial data. service-api owns this
    browser-facing contract and obtains data through the versioned
    service-data-sync internal API; provider identities and storage details are
    intentionally absent.
  x-contract-status: Proposed
x-http-method-policy: post-only
servers:
  - url: /api/v1
tags:
  - name: equities
security:
  - accessToken: []
paths:
  /equities:
    post:
      tags: [equities]
      operationId: listEquities
      summary: Search the published A-share instrument catalog
      parameters:
        - $ref: '#/components/parameters/Query'
        - $ref: '#/components/parameters/Exchange'
        - $ref: '#/components/parameters/ListingStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize100'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Deterministic cursor page ordered by exchange, symbol and instrumentId.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/EquityPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /equities/{instrumentId}:
    post:
      tags: [equities]
      operationId: getEquity
      summary: Get one instrument and its current company profile
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Published instrument detail.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/EquityDetailResponse'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /equities/{instrumentId}/bars:
    post:
      tags: [equities]
      operationId: listEquityBars
      summary: Read raw or adjusted daily, weekly or monthly bars
      description: |
        start and end are inclusive. qfq is anchored to adjustAsOf; when omitted,
        adjustAsOf defaults to end, capped at the latest published session.
        Weekly and monthly adjusted bars are built by adjusting daily OHLC before
        aggregation. A final-only range that has not passed publication returns 409.
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - $ref: '#/components/parameters/Interval'
        - $ref: '#/components/parameters/StartDate'
        - $ref: '#/components/parameters/EndDate'
        - $ref: '#/components/parameters/AdjustmentMode'
        - $ref: '#/components/parameters/AdjustAsOf'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize2000'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Bar page ordered by periodStart ascending.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/BarPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DataNotFinal'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /equities/{instrumentId}/adjustment-factors:
    post:
      tags: [equities]
      operationId: listEquityAdjustmentFactors
      summary: Read sparse cumulative adjustment-factor revisions
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - $ref: '#/components/parameters/StartDateOptional'
        - $ref: '#/components/parameters/EndDateOptional'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize500'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Current cumulative factor events ordered by effectiveDate.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/AdjustmentFactorPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /equities/{instrumentId}/corporate-actions:
    post:
      tags: [equities]
      operationId: listEquityCorporateActions
      summary: Read versioned dividend and share-distribution events
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - $ref: '#/components/parameters/StartDateOptional'
        - $ref: '#/components/parameters/EndDateOptional'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize100'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Corporate-action page.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/CorporateActionPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /equities/{instrumentId}/financial-reports:
    post:
      tags: [equities]
      operationId: listEquityFinancialReports
      summary: List current financial-statement versions
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - $ref: '#/components/parameters/StatementType'
        - $ref: '#/components/parameters/StartReportPeriod'
        - $ref: '#/components/parameters/EndReportPeriod'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize50'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Report headers ordered by reportPeriod descending.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/FinancialReportPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /equities/{instrumentId}/financial-reports/{reportId}:
    post:
      tags: [equities]
      operationId: getEquityFinancialReport
      summary: Get one financial statement and its canonical items
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - $ref: '#/components/parameters/ReportId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Financial report detail.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/FinancialReportDetailResponse'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

  /equities/{instrumentId}/financial-metrics:
    post:
      tags: [equities]
      operationId: listEquityFinancialMetrics
      summary: Read provider-reported or internally derived financial metrics
      parameters:
        - $ref: '#/components/parameters/InstrumentId'
        - $ref: '#/components/parameters/MetricCodes'
        - $ref: '#/components/parameters/MetricBasis'
        - $ref: '#/components/parameters/StartReportPeriod'
        - $ref: '#/components/parameters/EndReportPeriod'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize500'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Financial metric page.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/FinancialMetricPage'
        '204':
          description: Representation matches If-None-Match; POST response has no body.
        '400':
          $ref: '#/components/responses/ValidationProblem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/DependencyUnavailable'

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: service-api access token; all active USER, ADMIN and SUPER_ADMIN roles may read.

  parameters:
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Query:
      name: q
      in: query
      required: false
      description: Exact or prefix match on normalized symbol or current name.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    Exchange:
      name: exchange
      in: query
      required: false
      schema:
        $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/Exchange'
    ListingStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/ListingStatus'
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 512
    PageSize100:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageSize2000:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 500
    PageSize500:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    PageSize50:
      name: pageSize
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 160
    Interval:
      name: interval
      in: query
      required: true
      schema:
        $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/BarInterval'
    StartDate:
      name: start
      in: query
      required: true
      schema:
        type: string
        format: date
    EndDate:
      name: end
      in: query
      required: true
      schema:
        type: string
        format: date
    StartDateOptional:
      name: start
      in: query
      required: false
      schema:
        type: string
        format: date
    EndDateOptional:
      name: end
      in: query
      required: false
      schema:
        type: string
        format: date
    AdjustmentMode:
      name: adjust
      in: query
      required: false
      schema:
        $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/AdjustmentMode'
    AdjustAsOf:
      name: adjustAsOf
      in: query
      required: false
      schema:
        type: string
        format: date
    StatementType:
      name: statementType
      in: query
      required: false
      schema:
        $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/StatementType'
    StartReportPeriod:
      name: reportPeriodFrom
      in: query
      required: false
      schema:
        type: string
        format: date
    EndReportPeriod:
      name: reportPeriodTo
      in: query
      required: false
      schema:
        type: string
        format: date
    MetricCodes:
      name: metric
      in: query
      required: false
      description: Repeat the parameter to request up to 50 canonical metric codes.
      schema:
        type: array
        maxItems: 50
        uniqueItems: true
        items:
          type: string
          pattern: '^[a-z][a-z0-9_.-]{1,79}$'
    MetricBasis:
      name: basis
      in: query
      required: false
      schema:
        type: string
        enum: [reported, single-quarter, ttm]

  headers:
    ETag:
      description: Strong hash of normalized query and publication/data versions.
      schema:
        type: string

  responses:
    ValidationProblem:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Access token is missing, expired or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Requested published resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DataNotFinal:
      description: Requested final-only range contains unpublished or quarantined partitions.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: The authenticated user exceeded the equity-read budget.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    DependencyUnavailable:
      description: Published market data is temporarily unavailable or outside its freshness policy.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    Problem:
      allOf:
        - $ref: './0003-data-sync-equity-internal.openapi.yaml#/components/schemas/Problem'
